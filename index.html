<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命算法 · 六爻排盘 · 测事体系</title>
<style>
  :root {
    --bg:#f6f5f1; --card:#ffffff; --ink:#242220; --ink2:#8c8880; --line:#e6e3db;
    --red:#c0392b; --blue:#2a6fd6; --green:#1f8a4c; --gold:#b8860b; --purple:#7a3f9d;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; padding:12px 12px 40px; line-height:1.6;
  }
  .wrap { max-width:1440px; margin:0 auto; padding:0 20px; }
  header.app { display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px; }
  header.app .title { font-family:"Songti SC","SimSun",serif; font-size:19px; font-weight:600; letter-spacing:.1em; }
  header.app .sub { font-size:12px; color:var(--ink2); margin-top:2px; }
  .brand-logo { height:34px; opacity:.9; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  /* 输入区 */
  .qz-title { font-size:13.5px; font-weight:600; margin-bottom:10px; }
  .qz-title .dim { font-weight:400; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .row label { font-size:12px; color:var(--ink2); white-space:nowrap; }
  .row input[type=text] { flex:1; min-width:240px; }
  input, select { font-family:inherit; font-size:14px; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; }
  input:focus, select:focus { outline:2px solid rgba(42,111,214,.2); border-color:var(--blue); }
  .t-in { width:74px; text-align:center; }
  .t-unit { font-size:12px; color:var(--ink2); }
  .t-in.y { width:88px; }
  .btn { font-family:inherit; font-size:13px; font-weight:500; padding:7px 16px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .btn:hover { background:#f1efe9; }
  .btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
  .btn.primary:hover { background:#a93226; }
  .err { color:var(--red); font-size:12px; min-height:16px; }
  .pane { border-top:1px dashed var(--line); padding-top:12px; margin-top:4px; }
  .toss-auto { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:12px; background:#fbfaf7; }
  .ta-head { font-size:12px; color:var(--ink2); margin-bottom:8px; }
  .ta-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .ta-btn { font-family:inherit; font-size:12px; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink2); cursor:pointer; }
  .gua-dd { position:relative; display:inline-block; }
  .gua-dd-btn { min-width:120px; text-align:left; font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .gua-dd-btn:after { content:"▾"; float:right; color:var(--ink2); margin-left:6px; }
  .gua-dd-panel { position:absolute; top:calc(100% + 2px); left:0; z-index:60; width:200px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.14); padding:6px; }
  .gua-dd-panel input { width:100%; box-sizing:border-box; font-size:12px; padding:4px 8px; margin-bottom:4px; }
  .gua-dd-list { max-height:224px; overflow-y:auto; }
  .gua-dd-item { font-size:12.5px; padding:4px 8px; border-radius:6px; cursor:pointer; color:var(--ink); }
  .gua-dd-item:hover { background:#f2f6fc; }
  .ta-btn.primary { border-color:var(--red); color:var(--red); font-weight:600; background:#fdf3f2; }
  .ta-btn:disabled { opacity:.45; cursor:default; }
  .toss-auto.dual { border-style:dashed; border-color:var(--red); background:#fffdfb; }
  .dual-line { font-size:12px; color:var(--ink); line-height:1.7; }
  .dual-line b { color:var(--red); }
  /* 爻符 */
  .glyph { display:inline-flex; gap:7px; width:40px; vertical-align:middle; flex:0 0 auto; }
  .glyph i { display:block; height:5px; background:currentColor; border-radius:1px; flex:1; }
  .glyph.yang i:last-child { display:none; }
  .glyph.yang i:first-child { flex:0 0 100%; }
  .glyph.mv i { background:var(--red); }
  /* 盘面（整合式：元信息 → 整卦表 → 半卦 → 六爻表） */
  .meta-strip { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink2); margin-bottom:8px; align-items:center; }
  .meta-strip b { color:var(--ink); font-weight:600; }
  .sz-cell { display:flex; align-items:center; gap:8px; }
  .sizhu { border-collapse:collapse; font-size:11.5px; line-height:1.5; }
  .sizhu th, .sizhu td { border:1px solid var(--line); padding:1px 8px; text-align:center; font-weight:400; }
  .sizhu thead th, .sizhu tbody th { color:var(--ink2); font-weight:500; background:#fbfaf7; }
  .sizhu td { color:var(--ink); }
  /* 整卦/半卦图形版（v0.1.40）：卦象爻线图卡＋属性小字键值（参考奇门宫格小字语言）
     v0.1.42：整卦块与半卦卡共用同一「本｜模式｜变」三列模板，卦象与属性跨块上下对齐 */
  .gz-g { display:grid; grid-template-columns:1fr 110px 1fr; column-gap:10px; align-items:stretch; margin:2px 0 10px; }
  .duo { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 20px; align-items:start; margin-top:2px; }
  .duo-l, .duo-r { min-width:0; }
  .duo-hd { font-size:12px; font-weight:700; color:var(--ink2); letter-spacing:.06em; margin:2px 0 6px; }
  .duo-r .duo-hd { margin-top:0; }
  @media (max-width:1180px) {
    .duo { grid-template-columns:1fr; }
    .duo-r .duo-hd { margin-top:10px; }
  }
  /* 整卦成败分析两栏（v0.1.67）：左＝整卦图形块（左移），右＝成败分析面板（四项输出＋意愿） */
  .cbz { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 20px; align-items:start; }
  .cbz-l, .cbz-r { min-width:0; }
  .cbz-hd { border-bottom:1px solid var(--line); padding-bottom:4px; }
  @media (max-width:1180px) {
    .cbz { grid-template-columns:1fr; }
    .cbz-r { margin-top:10px; }
  }
  .cb-panel { border:1px solid var(--line); border-radius:10px; background:#fcfbf8; padding:2px 12px; font-size:12.5px; }
  .cb-row { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; padding:7px 0; border-bottom:1px dashed #e7e2d6; }
  .cb-row:last-of-type { border-bottom:none; }
  .cb-row i { font-style:normal; color:var(--ink2); font-size:11px; width:66px; flex-shrink:0; }
  .cb-row b { font-weight:700; }
  .cb-row span { font-size:12px; }
  .cb-row em { font-style:normal; flex-basis:100%; color:var(--ink2); font-size:11px; margin-top:2px; }
  table.cb-mini { width:100%; table-layout:fixed; border-collapse:collapse; font-size:11.5px; margin:4px 0 6px; }
  details.cb-fold { margin:4px 0 6px; }
  details.cb-fold > summary { list-style:none; cursor:pointer; background:#faf8f2; border:1px solid #eee9de; padding:5px 10px; font-size:11.5px; color:var(--ink2); font-weight:500; }
  details.cb-fold > summary::-webkit-details-marker { display:none; }
  details.cb-fold > summary::before { content:"▸ "; color:var(--ink3, #999); }
  details.cb-fold[open] > summary::before { content:"▾ "; }
  details.cb-fold > summary .dim { font-weight:400; }
  details.cb-fold > table.cb-mini { margin:0; }
  table.cb-mini th, table.cb-mini td { border:1px solid #eee9de; padding:4px 8px; text-align:left; vertical-align:top; line-height:1.5; }
  table.cb-mini th { background:#faf8f2; color:var(--ink2); font-weight:500; white-space:nowrap; }
  table.cb-mini th:nth-child(1) { width:66px; }
  table.cb-mini th:nth-child(2) { width:calc((100% - 66px)/2); }
  .sf-tag { display:inline-block; font-size:10px; line-height:1; padding:2px 4px; border-radius:4px; margin-right:4px; vertical-align:1px; font-style:normal; }
  .sf-wo { background:#e8f0e8; color:#3a6b3a; }
  .sf-ta { background:#f0e8e8; color:#8a4a4a; }
  .sf-stack { flex:1; min-width:0; }
  .sf-stack > b, .sf-stack > span, .sf-line { display:block; }
  .sf-stack > span, .sf-line + .sf-line { margin-top:3px; }
  .sf-mat { flex:1; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:3px 8px; align-items:baseline; }
  .sf-mat em { font-style:normal; font-size:10px; color:var(--ink2); white-space:nowrap; }
  .sf-mat b, .sf-mat > span { font-size:12px; }
  .cb-off { border:1px solid var(--line); border-radius:10px; background:#fcfbf8; padding:10px 12px; font-size:12.5px; }
  .gz-cell { border:1px solid var(--line); border-radius:10px; padding:8px 0 10px; background:#fcfbf8; border-top:3px solid var(--red); text-align:center; }
  .gz-cell .gz-name { text-align:center; font-family:"Songti SC","SimSun",serif; font-size:17px; font-weight:700; letter-spacing:.06em; margin-top:7px; }
  .gz-cell .gz-gong { text-align:center; font-size:11px; color:var(--ink2); margin:2px 0 7px; }
  .gz-mid { grid-column:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; font-size:12px; }
  .gz-arrow { font-size:20px; line-height:1; color:#c9c3b8; }
  .gf { display:inline-flex; flex-direction:column; gap:4px; }
  .gf-row { position:relative; display:flex; align-items:center; justify-content:center; }
  .gf-y { display:block; width:46px; height:6px; border-radius:2px; background:#57524a; }
  .gf-y.yin { background:linear-gradient(90deg,#57524a 0 42%,transparent 42% 58%,#57524a 58% 100%); }
  .gf-row.on .gf-y { background:var(--red); }
  .gf-row.on .gf-y.yin { background:linear-gradient(90deg,var(--red) 0 42%,transparent 42% 58%,var(--red) 58% 100%); }
  .gf-mk { position:absolute; left:calc(50% + 26px); width:11px; font-size:10.5px; font-style:normal; font-weight:700; color:var(--red); line-height:1; }
  .kvs { display:flex; flex-direction:column; gap:1px; }
  /* v0.1.76：属性双列改弹性等分（minmax(0,1fr)），duo/cbz 侧栏挤压时不再顶破卡片边框 */
  .kvs.gz, .kvs.hf { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); justify-content:center; column-gap:10px; row-gap:1px; text-align:left; }
  .kv { display:flex; align-items:baseline; font-size:10.5px; line-height:1.55; }
  .kv i { font-style:normal; color:var(--ink2); font-size:9.5px; width:38px; flex-shrink:0; }
  .kv b { font-weight:600; white-space:nowrap; }
  .kv .tv { flex-shrink:0; }
  .qigua-note { font-size:12px; color:var(--ink2); background:#faf8f3; border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin-bottom:8px; }
  table.board { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; margin-top:12px; }
  table.board col.c-god { width:56px; }
  table.board col.c-fu { width:78px; }
  table.board .tags-wx4 b { font-weight:400; }
  .st-pos { font-size:11.5px; font-weight:700; color:var(--red); border:1px solid var(--red); border-radius:3px; padding:1px 5px; white-space:nowrap; }
  .rl-ar { position:relative; display:inline-block; width:64px; height:12px; margin-top:13px; }
  .rl-ar .la { position:absolute; left:50%; top:-12px; transform:translateX(-50%); font-style:normal; font-size:10px; font-weight:600; color:var(--ink2); line-height:1; }
  .rl-ar .ln { position:absolute; left:2px; right:2px; top:50%; height:0; border-top:1.5px solid #a89f8d; }
  .rl-ar .ln::after { content:""; position:absolute; right:-2px; top:-4.25px; border-left:6px solid #a89f8d; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent; }
  .rl-ar.back .ln::after { right:auto; left:-2px; border-left:none; border-right:6px solid #a89f8d; }
  .rl-ar.both .ln::before { content:""; position:absolute; left:-2px; top:-4.25px; border-right:6px solid #a89f8d; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent; }
  .hf-wrap { margin-bottom:10px; }
  .hf-card { display:grid; grid-template-columns:1fr 110px 1fr; column-gap:10px; align-items:start; border:1px solid var(--line); border-radius:10px; padding:8px 0 10px; background:#fcfbf8; margin-bottom:8px; border-top:3px solid #d9d3c6; }
  .hf-head { display:contents; }
  .hf-side { display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 10px; }
  .hf-name { font-family:"Songti SC","SimSun",serif; font-size:15px; font-weight:700; display:flex; align-items:center; gap:4px; }
  .hf-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; font-size:12px; padding:0 6px; }
  .hf-body { display:contents; }
  .hf-body > .kvs.hf:first-of-type { grid-column:1; grid-row:2; }
  .hf-body > .kvs.hf:last-of-type:not(:first-of-type) { grid-column:3; grid-row:2; }
  .hf-card .kvs.hf { border-top:1px dashed var(--line); margin:7px 10px 0; padding-top:6px; }
  .gz-cell .kvs { border-top:1px dashed var(--line); margin:7px 10px 0; padding-top:6px; }
  .hf-rels { display:flex; flex-direction:column; gap:2px; margin:4px 0 0; }
  .hf-rel { display:grid; grid-template-columns:1fr 110px 1fr; column-gap:10px; font-size:10.5px; align-items:baseline; line-height:1.6; }
  .hf-rel .rc { display:grid; grid-template-columns:38px 1fr; margin:0 10px; }
  .hf-rel .rc i { font-style:normal; color:var(--ink2); font-size:9.5px; }
  .hf-rel .rc b { font-weight:600; }
  .hf-rel .rc-r > * { grid-column:2; }
  .tv { font-style:normal; font-weight:400; font-size:8.5px; margin-left:1px; }
  .tv-up { color:var(--green); } .tv-down { color:var(--red); } .tv-flat { color:var(--ink); }
  .v-good { color:var(--green); } .v-bad { color:var(--red); }
  table.board th { font-size:11.5px; color:var(--ink2); font-weight:500; text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  table.board td { padding:7px 6px; border-bottom:1px solid #f1efea; vertical-align:middle; }
  table.board tr[data-pos] { cursor:pointer; }
  table.board tr[data-pos]:hover { background:#faf9f5; }
  tr.r-shi td.c-ben { background:#f4f9f4; }
  tr.r-ying td.c-ben { background:#f4f7fd; }
  .c-ls { width:56px; color:var(--ink2); font-size:13px; }
  .c-fu { width:110px; font-size:12.5px; color:var(--gold); }
  .fu-line { line-height:1.5; }
  .c-ben, .c-bian { white-space:normal; }
  .c-bian-echo { color:var(--ink2); }
  .c-bian-wxchg { background:#fbecec; }
  .c-bian-echo .lq { font-weight:500; }
  .c-ben .lq, .c-bian .lq { margin:0 6px; font-weight:600; }
  .c-ben .gz2, .c-bian .gz2 { font-size:15px; letter-spacing:.02em; white-space:nowrap; }
  .tags { margin-left:8px; font-size:11px; }
  .tags-wx4 { margin-top:3px; font-size:10.5px; color:var(--ink2); letter-spacing:.3px; white-space:normal; }
  .tag { font-style:normal; font-weight:600; padding:1px 5px; border-radius:4px; margin-right:3px; background:#f0eee9; color:var(--ink2); }
  .tag.wxx { background:#fff; border:1px solid #e5e2db; padding:0 5px; }
  .tag.shi { background:#e4f1e4; color:var(--green); }
  .tag.ying { background:#e4ecf9; color:var(--blue); }
  .tag.dong { background:#fde8e6; color:var(--red); }
  .tag.an { background:#fdf3e0; color:var(--gold); }
  .tag.kong { background:#efe9f7; color:var(--purple); }
  .tag.mkong { background:#faf7fd; color:var(--purple); }
  .tag.mu { background:#f6e9dd; color:#9a5b1f; }
  .tag.po { background:#f7dcd8; color:#9c2b1e; }
  .tag.shen-yuan { background:#e4f1e4; color:var(--green); }
  .tag.shen-yong { background:#fdf1dc; color:#a8680a; box-shadow:0 0 0 2px #fff, 0 0 0 4px currentColor; }
  .hd-ys { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .duo-l .hd-ys { margin-top:10px; }
  .yao-sec { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 20px; align-items:start; margin-top:2px; }
  .yao-l, .yao-r { min-width:0; }
  .yao-l .hd-ys { margin-top:0; }
  .yao-r textarea { width:100%; box-sizing:border-box; min-height:420px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:#fbfaf7; padding:10px 12px; font-size:13.5px; line-height:1.7; color:var(--ink); font-family:inherit; }
  .yao-r textarea:focus { outline:none; border-color:#d8d2c4; background:#fff; }

  .warn { color:var(--gold); font-weight:600; }

    yi: "离的本质是文明显达：内在虚心、外表光明，事情靠「亮出来」而成立——名分、文书、形象、道理。它代表事情最清楚可见、最需要摆上明面的一段。",
    zhan: "占得离主导之事：事在附丽，宜依附正道、凡事摆到明面上去做，有文书契约的把文书落实。忌两点：一是火无柴可附——根基虚了空热闹；二是急火虚炎，烧得快灭得也快。"

  "震": {

    lei: "人物为长男、行者、有声望的发起者；身体为足（脚）；动物为龙；五行属木；方位东；季节春。凡发动、声闻、惊动、开创起步之事归震。",
    yi: "震的本质是奋动而兴：局面靠一个动作打破，先动者得先机。它代表事情刚刚起势的一段——动静大、反应多、旧平衡被惊醒。",
    zhan: "占得震主导之事：事在初动，宜乘势而起、说干就干，行动本身就是答案。忌两点：一是惧怕变动错失窗口，二是妄动无序——雷要打得响更要打得准。"
  },
  "巽": {
    xiang: "一阴伏于下、二阳在上（☴），阴气潜入阳下，取象为风。风无孔不入、无声浸润，所以性德是「入」——以柔顺渗透的方式进到事情里面去。",
    lei: "人物为长女、师者、商旅、传递者；身体为股（腿，随行而动）；动物为鸡；五行属木；方位东南；季节春夏之交。凡渗透、进退、往来、反复斟酌之事归巽。",
    yi: "巽的本质是顺入渐进：不硬攻、不强求，一遍遍进入、一层层深入，靠重复与柔和取胜。它代表事情需要耐心渗透、不宜声张的一段。",
    zhan: "占得巽主导之事：事在缓入，宜放低姿态、持续渗透，柔着进比横着撞快。忌两点：一是优柔不决、进进退退——风一停就什么都进不去；二是只随不立，入了局却拿不了主意。"
  },
  "坎": {
    xiang: "一阳陷于二阴之间（☵），刚被柔包，取象为水。水行险而不失其信、外柔内刚，所以性德是「陷」——事中有险，险中有实。",
    lei: "人物为中男、行者、涉险之人、忧劳者；身体为耳（听）；动物为豕；五行属水；方位正北；季节冬。凡险难、暗昧、奔波、酒水流动之事归坎。",
    yi: "坎的本质是险中之行：事情进入了有难度、有不确定的一段，但险中藏着唯一那条实的路——像水中暗流，会游的人照样过得去。",
    zhan: "占得坎主导之事：事在险中，宜守实待时——抓住里面那条真实的凭据（人、钱、理），一条线走到底，不贪不惧。忌两点：一是心里先乱、自陷自怕；二是硬闯强渡，险不是闯过去的，是渡过去的。"
  },
  "艮": {
    xiang: "一阳止于上、二阴承之（☶），阳气升至顶而停，取象为山。山巍然不动、边界分明，所以性德是「止」——知道该停在哪里。",
    lei: "人物为少男、守成者、隐者、门卫之人；身体为手（握、止）；动物为狗（守）；五行属土；方位东北；季节冬春之交。凡停止、界限、守护、积蓄之事归艮。",
    yi: "艮的本质是知止而安：停下不是失败，是时位到了——止在当止之处，本身就是正确的动作。它代表事情需要收束、静置、守住成果的一段。",
    zhan: "占得艮主导之事：事当止，宜守住现成局面、明确边界，不再扩张、不再争。忌两点：一是该止不止、贪进生悔；二是死止不动——山也有草木生长，止中要有守成之活。"
  },
  "坤": {
    xiang: "三爻全阴（☷），纯阴之体，取象为地。三根阴爻叠成最包容的承接结构：不主导、不争先，承载一切并使之生长，所以性德是「顺」——厚德载物。",
    lei: "人物为母、众人、辅佐者、大众；身体为腹（包容）；动物为牛；五行属土；方位西南；季节夏秋之交。凡土地、民众、后勤、承载之事归坤。",
    yi: "坤的本质是承载与成就他人：不抢主位，却让主导者的事落地生根。它代表事情最需要配合、积累和耐心的一段——顺着大势走，反而走得最远。",

var GUA_YI_DETAIL = {
  乾为天: { xiang:"上乾（天）下乾（天）—— 两天相并，六爻纯阳，至刚至健", guaci:"乾：元，亨，利，贞。", yi:"天的运行日夜不停、四季不乱，乾就是这股刚健不息的原动力。六爻皆阳，没有一点阴柔杂质——事情从头到尾由一股主导力量推着走，格局宏大；但刚极易折，过刚则脆。", zhan:"得乾，大势在你手里：主动权、领导权、开创期。宜自强不息、按节奏推进，不宜冒进硬撞；盛时更要留余地——上九亢龙有悔。" },
  坤为地: { xiang:"上坤（地）下坤（地）—— 两地相叠，六爻纯阴，至柔至顺", guaci:"坤：元亨，利牝马之贞。君子有攸往，先迷后得主。", yi:"大地承载万物、顺势而生，坤是柔顺、包容、成全的力量。六爻皆阴——事情的成功不靠你冲，靠你承载、配合、跟随：像母马那样柔顺而行，反而找到方向；抢先冒头反而迷失（先迷后得主）。", zhan:"得坤，宜守不宜攻、宜辅不宜主。跟对人、托住事、做好承载，厚德载物自然有收获；争先出头反而失位。" },
  水雷屯: { xiang:"上坎（水）下震（雷）—— 云行雷动而雨未成，草创之初", guaci:"屯：元亨利贞。勿用有攸往，利建侯。", yi:"雷在地下动、水在上面压——新生力量刚冒头就遇阻，万事开头难的卦。种子破土最吃力，但生机已在内，只是还没长开。", zhan:"得屯，处在起步艰难期：事有生命力，阻力也真实。宜站稳根、搭班子、找帮手（利建侯），不宜急着向外扩张（勿用有攸往）。" },
  山水蒙: { xiang:"上艮（山）下坎（水）—— 山下流出泉水，蒙昧初开", guaci:"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。", yi:"泉水刚从山下冒出来，源头清澈但不知所往——蒙是幼稚、不懂、未启蒙的状态。出路在于求教：心诚、主动、专一地请教就能开通；心不诚、反复乱问，得不到真东西（渎则不告）。", zhan:"得蒙，说明这事你还看不清，或对方处于懵懂状态。解法只有一条：找对老师／行家，诚心求教一次问透；自己瞎摸索、病急乱投医，反而更糊涂。" },
  水天需: { xiang:"上坎（险）下乾（健）—— 云聚天上而雨未落，等待时机", guaci:"需：有孚，光亨，贞吉，利涉大川。", yi:"前面有险（坎），自身刚健（乾）——有力气过河，但时候未到。需的核心是「等」：不是消极干耗，是带着诚信与准备地等，等云变成雨。", zhan:"得需，事能成，但现在要等。条件未齐、时机未到，硬闯会撞上坎险；守正、备粮、养精蓄锐，时机一到再动，反而大利涉川。" },
  天水讼: { xiang:"上乾（天）下坎（水）—— 天西转水东流，相违而行，争讼之象", guaci:"讼：有孚窒惕，中吉，终凶。利见大人，不利涉大川。", yi:"上下相违、双方对着干——讼是争执、官司、谈判僵局。争讼没有真赢家：适可而止（中）则吉，把官司打到底（终）必凶。解局靠大人——找有公信力的第三方评理。", zhan:"得讼，正处或即将进入争执。策略：道理站得住（有孚）但别恋战，能谈就谈、能停就停，请权威中间人裁决；硬碰硬把事闹大，必两败俱伤。" },
  地水师: { xiang:"上坤（地）下坎（水）—— 水藏地中，兵众蓄而待发", guaci:"师：贞，丈人吉，无咎。", yi:"师是用兵、动员、大动作。水聚在地里，力量已经蓄住，但出兵要「正」——名正言顺、纪律严明，而且要交给丈人——有威望有经验的统帅。兴师动众，讲的是资格与章法。", zhan:"得师，要做大动作、动用大批资源（项目上线、团队作战、正面竞争）。胜负看两条：出师有名、带队的人够格。二者具备则吉，缺一先补。" },
  水地比: { xiang:"上坎（水）下坤（地）—— 水行地上，与地亲密无间", guaci:"比：吉。原筮，元永贞，无咎。不宁方来，后夫凶。", yi:"比是亲近、依附、结盟：水铺在地上、地承着水，互相离不开。结盟要趁早看清对象（原筮）——找能长久依靠的（元永贞）；大家都在找靠山，来得晚的、挑剩下的，反而凶（后夫凶）。", zhan:"得比，宜抱团、结盟、找靠山，不宜单干。关键是选对象：审慎考察、找能长期共赢的；观望太久、别人都站好队你才动，好位置没了。" },
  风天小畜: { xiang:"上巽（风）下乾（天）—— 风行天上，云密而雨未落，小有蓄聚", guaci:"小畜：亨。密云不雨，自我西郊。", yi:"小畜是小积累、小蓄势：云已经很厚（密云），但还没到下雨成事的时候。以阴畜阳、以小畜大——你手里攒了些资源本钱，但量还不足以摊开做大的。", zhan:"得小畜，处于蓄势期：方向对、势头有，家底还薄。别急着总攻，继续积攒（钱、人、作品、信用），攒到雨下来，自然水到渠成。" },
  天泽履: { xiang:"上乾（天）下兑（泽）—— 上天下泽，尊卑各安其位，履礼而行", guaci:"履：履虎尾，不咥人，亨。", yi:"履是行走、践行：踩着老虎尾巴走——前面是刚强的大人物／大势（乾），你以礼相待、小心跟在后面，虎不咬人。礼数到位、位置摆正，险地也能通行。", zhan:"得履，是在强者或强势局面下行事。能过，但有前提：姿态放对（守礼、不越位）、脚步放轻、规矩看清。不逞强、不抢戏，踩着虎尾也走得过去。" },
  地天泰: { xiang:"上坤（地）下乾（天）—— 天气下降、地气上升，天地交而万物通", guaci:"泰：小往大来，吉，亨。", yi:"泰是通泰亨通：天本在上却往下走，地本在下却往上迎——上下交、彼此通，生机流动。阳从下面长上来，大势向好，小的付出换来大的进来（小往大来）。", zhan:"得泰，顺境：上下同心、内外通畅，是做事的好时候。注意两点：泰极会否，顺境别飘；主动保持交通——多沟通多让利，通才会一直通。" },
  天地否: { xiang:"上乾（天）下坤（地）—— 天愈上、地愈下，天地不交而闭塞", guaci:"否：否之匪人，不利君子贞，大往小来。", yi:"否是闭塞不通：天只管天、地只管地，上下不沟通、内外不循环——阳气往外跑（大往），阴气往里收（小来）。不是人不行，是势闭塞了。", zhan:"得否，处在阻塞期：沟通不畅、付出多回报少、有劲使不出。策略是收缩、蛰伏、保全，别硬扛着出头的原则死磕；记死一句——否极泰来，等翻转点。" },
  天火同人: { xiang:"上乾（天）下离（火）—— 火性上炎与天相合，协同之象", guaci:"同人：同人于野，亨。利涉大川，利君子贞。", yi:"同人是协同、同心：火向上、天在上，同声相应——目标一致就能成事。要点在「于野」：协同要开放到大野外那么宽的圈子，不能拉小圈子（同人于宗，吝）。", zhan:"得同人，宜合作、结伙、找同路人：志同道合则大事可做（利涉大川）。注意圈子的开放性——只跟自己人抱团、排他，路会越走越窄。" },
  火天大有: { xiang:"上离（火）下乾（天）—— 太阳高悬天上，无所不照，大有之象", guaci:"大有：元亨。", yi:"大有是大丰收、大拥有：太阳在天上照见一切、拥有一切。诸阳归于一阴（六五）统摄——财富、资源、人心汇聚到主导者这里，格局盛大，元亨。", zhan:"得大有，进入收获期、持有期：资源、名气、成果都在手上。最该做的是盛而不溢——分享得当、用人得当，让拥有变成长久的拥有。" },
  地山谦: { xiang:"上坤（地）下艮（山）—— 高山藏于地下，有大而不显", guaci:"谦：亨，君子有终。", yi:"谦是谦退：本是大山（有能力、有高度），却藏在地平线下不露。谦是六十四卦中唯一六爻皆吉的卦——天道亏盈而益谦，把自己放低的人，处处得利、有始有终。", zhan:"得谦，赢家姿态恰恰要低调：有成绩不张扬、有本事不压人。放低不是没底气，是让所有人舒服、让阻力消失——谦到极致，事自然成，而且收得住尾。" },
  雷地豫: { xiang:"上震（雷）下坤（地）—— 雷出地上，万物振奋，和乐之象", guaci:"豫：利建侯行师。", yi:"豫是和乐、预备：雷破土而出、万物振奋——顺而动，先声夺人。豫有两面：顺势而动则万众响应（利建侯行师）；沉溺安逸、得意张扬（鸣豫）则凶。", zhan:"得豫，势起来了、人心振奋，适合借势组织人马、宣布大事。同时警惕：越顺越乐，越要保住准备与警觉，别在掌声里松掉。" },
  泽雷随: { xiang:"上兑（泽）下震（雷）—— 雷入泽中随时而息，随之象", guaci:"随：元亨利贞，无咎。", yi:"随是跟随、顺应：雷入泽中随息，柔顺地跟上节奏。随的智慧在「择所随」——跟对人则元亨无咎；同时以正相随，不是无原则地附和。", zhan:"得随，此时宜跟随不宜主抓：跟大势、跟强者、跟节拍走，反而大顺。选跟随对象要正；若别人在跟随你，你自己的立场更要稳。" },
  山风蛊: { xiang:"上艮（山）下巽（风）—— 风在山下吹不出去，物久生蠹，整治之象", guaci:"蛊：元亨。利涉大川。先甲三日，后甲三日。", yi:"蛊是败坏、积弊：东西放久了生虫，局面久了生弊。但蛊卦元亨——坏到明处恰恰是整治的时机。要点是先甲三日、后甲三日：动手前后都反复推演，谋划周全再改。", zhan:"得蛊，你面对的是旧账、积弊、烂摊子（自己的或接手的）。这是改革的卦：乱局里藏着大机会，敢治则亨通大顺；但必须谋定后动——前因后果、各方反应想透再下手。" },
  地泽临: { xiang:"上坤（地）下兑（泽）—— 地高泽低，居高临下，阳长之势", guaci:"临：元亨利贞。至于八月有凶。", yi:"临是临近、临事、以上临下：两个阳爻正从下面长大——势头向上、蓄势逼近。元亨利贞，但挂着一句提醒：至于八月有凶——涨势有周期，盛过了头就轮到消。", zhan:"得临，正是接近目标、逐步得势的阶段：宜趁势推进、亲临一线。记住周期——现在的好势头不会永远在，趁「八月」之前把关键动作做完。" },
  风地观: { xiang:"上巽（风）下坤（地）—— 风行地上，遍观万物，观示之象", guaci:"观：盥而不荐，有孚颙若。", yi:"观是观察、观摩、示范：祭祀刚洗手献诚那一刻最动人（盥而不荐）——观的重心不是流程，是诚与象。上也观下、下也观上：你在看别人，别人也在看你。", zhan:"得观，先看后动：这事还没到出手阶段，多观察、多学习、多看全局。同时注意自身形象与示范效应——你被看着呢；看准了再动，动则拿出盥礼那样的真诚意。" },
  火雷噬嗑: { xiang:"上离（电）下震（雷）—— 雷电交合，明辨威猛，啮而合之", guaci:"噬嗑：亨。利用狱。", yi:"噬嗑是咬合：上下颚中间卡了东西，咬掉它才能合上——清除障碍才能亨通。象是雷电：电为明（看得清）、雷为威（下得去手），最适合用狱——断案、执规、清除捣乱因素。", zhan:"得噬嗑，事情卡在一个具体障碍或捣乱者上。解法是又明又猛：先把是非查清楚（明），然后坚决处置、绝不手软（威）。障碍一除，上下就合上了。" },
  山火贲: { xiang:"上艮（山）下离（火）—— 火照山下，草木生辉，文饰之象", guaci:"贲：亨。小利有攸往。", yi:"贲是文饰、装饰、包装：火光照亮山体——内容靠形式出彩。贲能亨通，但只小利有攸往：包装是加分项不是主菜，内在（山）才是本体，饰过了头反而失真。", zhan:"得贲，适合打磨呈现：做形象、做包装、做门面，能把事推上一层。分寸是「小」——修饰到位即可，别把成本与心思全押外观，更别文过饰非。" },
  山地剥: { xiang:"上艮（山）下坤（地）—— 山石崩落于地，剥落将尽", guaci:"剥：不利有攸往。", yi:"剥是剥落、衰耗：五阴在下层层剥一阳——资源、根基被一块块剥走，只剩最后一点（上九）。势在剥时，动则加速剥落；但剥到极处，硕果仅存的那颗种子，是来年复生的本钱。", zhan:"得剥，处在损耗期：不扩张、不远行（不利有攸往），止损、收缩、保住核心。把最后那点元气（关键资产、核心人、底仓）护住，等剥尽复生的转机。" },
  地雷复: { xiang:"上坤（地）下震（雷）—— 一阳复生于五阴之下，雷动地中", guaci:"复：亨。出入无疾，朋来无咎。七日来复，利有攸往。", yi:"复是回复、复苏：剥到只剩一阳，如今这颗种子重新在地底萌动——最黑暗处升起的一点阳气。复卦亨通：按周期（七日来复）转回来是必然，顺着这股新生力量走，有利。", zhan:"得复，低谷已过、转机刚冒头：关系回暖、亏损见底、旧事重启。此时动而不疾、来而不迫（出入无疾），拉着伙伴一起（朋来），顺着回升势头走，越走越顺。" },
  天雷无妄: { xiang:"上乾（天）下震（雷）—— 天下雷行，万物依时，无妄之象", guaci:"无妄：元亨利贞。其匪正有眚，不利有攸往。", yi:"无妄是不妄为、不妄求：雷行天下，万物都按本分与时序生长。守正则元亨利贞，一切自然而然；起歪念、走偏门（匪正）立刻招灾（有眚）。此卦的奖惩来得又快又直接。", zhan:"得无妄，事在正轨上就走大运：老实做事、按规矩来，回报自然来。千万别在此卦耍小聪明、动歪心思、搞侥幸动作——天地昭昭，一妄就眚。" },
  山天大畜: { xiang:"上艮（山）下乾（天）—— 山中蕴天，所畜至大，蓄养之象", guaci:"大畜：利贞。不家食吉，利涉大川。", yi:"大畜是大蓄积：山中包着天——蓄的不是小钱小粮，是大力、大贤、大格局。畜到这个量级就该放出去了：不家食吉（别守在家里吃老本）、利涉大川（可以干大事了）。", zhan:"得大畜，家底已厚、蓄势已成：是出去干大事的时机，别再憋着。但注意畜的本义——先用养分把自己和团队养到位（养贤），再放手大干，无往不利。" },
  山雷颐: { xiang:"上艮（山）下震（雷）—— 上止下动，如口咀嚼，颐养之象", guaci:"颐：贞吉。观颐，自求口实。", yi:"颐是口、是养：上静下动像一张嘴——怎么说话、怎么吃饭、怎么养活自己和别人。核心两问：观颐（看你怎么养——养人还是养于人、养正还是养欲），以及自求口实（靠自己求食）。", zhan:"得颐，重点转到养上：养身、养团队、养项目现金流。守住正道去养则吉；靠谁养、怎么吃，决定这局成败——自力更生（自求口实），别指望别人喂。" },
  泽风大过: { xiang:"上兑（泽）下巽（木）—— 水漫过木，四阳过盛居中，大过之象", guaci:"大过：栋桡。利有攸往，亨。", yi:"大过是大过越：中间四阳过刚过盛，两头阴柔撑不住——房梁被压弯（栋桡）。非常之时有非常之力，反常但可用：非常之事（利有攸往）恰恰要靠这种过人的劲去扛。", zhan:"得大过，局面超常规：要么负担过重（独立支撑大梁，小心压弯），要么需要非常手段。判断看事本身：事非常（大项目、大转折），用过人的资源与魄力应对则亨通。" },
  坎为水: { xiang:"上坎（水）下坎（水）—— 重水叠流，险中有险", guaci:"坎：习坎，有孚，维心亨，行有尚。", yi:"坎是险、是陷：双坎相重——一险未出一险又至，最低谷的卦。过关唯一姿势写在卦辞里：有孚（守诚信）、维心亨（心里始终不乱）、行有尚（继续往前走）。水永远向前流，险地靠的是内心的定。", zhan:"得坎，正处连环困难期：别指望一次脱困，接受险中有险的现实。法宝是心态与信用——内心不断线、承诺不破产，一步一步照走；水流不争先，终能出险。" },
  离为火: { xiang:"上离（火）下离（火）—— 光明接连升起，附丽之象", guaci:"离：利贞，亨。畜牝牛，吉。", yi:"离是火、是明、是附丽：火必须附着在柴上才能烧——光明再盛，也要有依托。两离相叠，文明连绵。卦辞给的是柔的功夫：畜牝牛吉——越在明亮得势的位置，越要用柔顺养住它。", zhan:"得离，处在显达、曝光、有光的位置：事能亨通，但记住火的本质——附着。你的光靠什么烧着（平台、团队、内容载体）？稳住依托、以柔济刚，光明才持续。" },
  泽山咸: { xiang:"上兑（泽）下艮（山）—— 山泽通气，二气相感", guaci:"咸：亨，利贞，取女吉。", yi:"咸是感应、交感：山上的泽、泽下的山，气息相通——不经意的相互吸引与共鸣。取女吉：感情、缘分之事最吉。咸的要点是虚己以受人——把自己放空，感应力才灵。", zhan:"得咸，宜感应之事：感情、合作、共鸣、结缘，此卦最顺。少算计、多真诚，心放虚、人放近；以诚相感的事都能成，带着算盘去感则不灵。" },
  雷风恒: { xiang:"上震（雷）下巽（风）—— 雷动风行，相辅相成，恒久之象", guaci:"恒：亨，无咎，利贞。利有攸往。", yi:"恒是恒常、持久：雷与风相互助长，动而相随不厌——长久之道。恒不是死守不动，是立得住的节奏反复走：方向不变、动作常新。持恒则亨通无咎，且利于继续往前。", zhan:"得恒，宜守常不宜折腾：已跑通的事继续做、已定下的关系继续养，时间会给你复利。检查所持之道正不正——正，恒下去就是赢；不正，趁早换，别恒。" },
  天山遁: { xiang:"上乾（天）下艮（山）—— 天远山高，阴长阳退，退避之象", guaci:"遁：亨。小利贞。", yi:"遁是退避、隐退：阴气渐长，阳者远引——该退就退，退是主动的战略，不是失败。遁而亨：退得对，路反而宽；此时坚持（贞）只利小事，别硬扛大局。", zhan:"得遁，宜退不宜进：抽身、瘦身、回避锋芒、退出某个局。退得越果断越亨通；在不对的势里硬撑着当主角，损耗最大。退下来养精蓄锐，等下一波。" },
  雷天大壮: { xiang:"上震（雷）下乾（天）—— 雷震天上，阳气壮盛", guaci:"大壮：利贞。", yi:"大壮是壮盛：四个阳爻轰轰往上涨，雷在天上响——力量最盛之时。卦辞只给两个字：利贞——越是壮，越要走正、越要守规矩。壮而正则所向披靡；壮而邪则加速自毁（羝羊触藩，进退两难）。", zhan:"得大壮，你的势与力都在高点：正是发力做局的窗口期。唯一纪律是正——凭实力凭规则赢，别仗势欺人、别蛮干硬冲，否则公羊顶篱笆，进退不得。" },
  火地晋: { xiang:"上离（火）下坤（地）—— 明出地上，太阳渐升，晋进之象", guaci:"晋：康侯用锡马蕃庶，昼日三接。", yi:"晋是晋升、前进：太阳一出地面越照越亮——依附光明、往上走。晋卦讲进得漂亮：像康侯凭本事与柔顺得赏（锡马蕃庶、昼日三接——一天被接见三次），进得上位，也进得人心。", zhan:"得晋，上升通道打开：升职、曝光、被重用、事往上走。姿势是柔顺上进——靠着光（跟对方向、贴着主线）升，不踩着人升，则进步与好评一起来。" },
  地火明夷: { xiang:"上坤（地）下离（火）—— 明入地中，太阳沉落，光明受伤", guaci:"明夷：利艰贞。", yi:"明夷是光明被掩：太阳落到地下——贤者受伤、才华被埋、环境昏暗。唯一策略是利艰贞：在艰难中守住正道、藏起锋芒。文王、箕子皆在此卦：外面装糊涂，里面不灭灯。", zhan:"得明夷，处在被打压、被埋没、环境不公的阶段：别硬出头、别解释、别消耗。把光收进地里——低调做事、暗自积累、保住内核，等太阳再升（晋）的那天。" },
  风火家人: { xiang:"上巽（风）下离（火）—— 火燃风生，由内及外，齐家之象", guaci:"家人：利女贞。", yi:"家人是家庭、内部组织：一切外部成就从内部治理开始——风自火出（影响由内而生）。治家的关键是各正其位：父母子女各安其分，内有规矩、外有形象（利女贞——主内的正最要紧）。", zhan:"得家人，重点回到内部：家事、团队内务、组织根基。先把里面理顺——分工、规矩、温度都到位，外面的事自然顺风；内部失火，外面全白忙。" },
  火泽睽: { xiang:"上离（火）下兑（泽）—— 火炎上、泽润下，志不同行，乖离之象", guaci:"睽：小事吉。", yi:"睽是乖离、分歧：火往上烧、水往下淌——同处一屋各奔东西。睽时成不了大事（大事需要合力），但小事吉：小事、分头小事、私下沟通，反而能做。睽的本源常是猜疑——主动小步释疑，异可渐同。", zhan:"得睽，出现了分歧、误会、离心：别硬推大动作（推不动），拆成小事、一对一沟通、一点点对齐。记住睽久必合——主动破冰的那个，掌握复合的主动权。" },
  水山蹇: { xiang:"上坎（险）下艮（止）—— 前险后阻，行路蹇难", guaci:"蹇：利西南，不利东北。利见大人，贞吉。", yi:"蹇是蹇难：前面是水险、后面是山阻——腿脚被困，寸步难行的卦。出路两条：换方向（利西南——走平易处）、见大人（找有力的人帮）。蹇时反身修德，稳住（贞）则吉。", zhan:"得蹇，正面硬走的路堵死了：此路不通就换路（往容易的方向绕）、找贵人搭手。硬闯是下策；稳住阵脚、借力绕行，难局能解。" },
  雷水解: { xiang:"上震（雷）下坎（水）—— 雷雨大作，险散解消", guaci:"解：利西南。无所往，其来复吉；有攸往，夙吉。", yi:"解是解除、化解：雷一声、雨一场，冻结的都化了——困局松动、问题消解。解卦讲时机：没事可解就回归本位（其来复吉），有事要办就趁早（夙吉）。宜快不宜拖。", zhan:"得解，困局开始松冻：矛盾可解、僵局可破。趁势快办——该和解的和解、该推进的推进，别让融化的窗口又冻回去。办完就收（无所往则复），别恋战。" },
  山泽损: { xiang:"上艮（山）下兑（泽）—— 泽自损而益上，减损之象", guaci:"损：有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享。", yi:"损是减损：泽往下渗、自己减，去益上面的山——损下益上、损己利人。损的智慧是诚与省：有诚信（有孚），减损反而是大吉；祭品两碗（二簋）就够——重在心意，不在排场。", zhan:"得损，要做减法：砍成本、让利、割爱、断舍离。损得心诚、损在点子上，是元吉的开始——该减的减掉，往前走反而更轻更快。别为省而省，减完要有增益的去处。" },
  风雷益: { xiang:"上巽（风）下震（雷）—— 风烈雷迅，相得益彰，增益之象", guaci:"益：利有攸往，利涉大川。", yi:"益是增益：与损相反——上减下来益下，风雷相互助长。损上益下，民说无疆——得益之道在给：给下面、给对方、给生态，然后风雷相薄、越滚越大。利涉大川：可干大事。", zhan:"得益，进入增益期：增长、扩张、得助力。姿势是先予后取——让利给用户、伙伴、团队，益才能自我滚动。风雷之势宜趁热往前走（利有攸往），此卦不宜守成不动。" },
  泽天夬: { xiang:"上兑（泽）下乾（天）—— 五阳决去一阴，刚决果决", guaci:"夬：扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。", yi:"夬是决断、决胜：五个阳爻把最后一个阴爻顶出去——力量悬殊的最后一决。卦辞的纪律很细：公开宣示（扬于王庭）、心怀戒惧（孚号有厉）、先安内部（告自邑）、不动刀兵（不利即戎）。赢定了，更要有赢家的分寸。", zhan:"得夬，到了做决断、清障碍的最后关头：优势在你，该断则断。但要光明正大、留有余地、稳住内部——以势压人、动粗鲁手段，赢了场面输了人心。" },
  天风姤: { xiang:"上乾（天）下巽（风）—— 一阴始生五阳之下，不期而遇", guaci:"姤：女壮，勿用取女。", yi:"姤是相遇、遭遇：一个阴爻悄悄从底下长进来——不期而遇的变量进来了。卦辞警示女壮：小的变量别小看，它处在能生长的位置，纵容则渐壮、反客为主。遇可以，要辨其性、控其势。", zhan:"得姤，出现了新相遇或新变量：机会或麻烦都带「意外」属性。处理原则：不回避相遇，但要早辨识、早定规则——别让初来乍到的小因素，长成撬动全局的力量。" },
  泽地萃: { xiang:"上兑（泽）下坤（地）—— 水聚泽上，万物荟萃", guaci:"萃：亨。王假有庙，利见大人，亨，利贞。用大牲吉。利有攸往。", yi:"萃是聚合、汇聚：水聚成泽、人聚成群——资源、人气汇集而来。聚要有魂：王假有庙（有共同的精神旗帜）、利见大人（有主心骨）。聚起来就旺，用大牲（大动作）也吉。", zhan:"得萃，聚人聚财聚资源的时机：组队、招商、搞活动、建社群，正当其时。关键是给聚拢来的力量一个庙——共同的目标与仪式感，加上靠谱的主事人；聚而不散则大吉。" },
  地风升: { xiang:"上坤（地）下巽（木）—— 木生地中，长而渐高，上升之象", guaci:"升：元亨。用见大人，勿恤。南征吉。", yi:"升是上升：树从地里长出来，天天向上——柔顺积累后的自然攀升。升的路径是用见大人（借力贵人、靠大平台）、勿恤（别多疑焦虑）、南征吉（朝着光明处走）。", zhan:"得升，处于稳步上升期：长势已成，重要的是不停、不疑。该见的贵人去见、该靠的平台去靠，专注向上生长；疑虑（恤）是升势最大的敌人。" },
  泽水困: { xiang:"上兑（泽）下坎（水）—— 泽中无水，草木困枯", guaci:"困：亨。贞，大人吉，无咎。有言不信。", yi:"困是困顿：泽里没水了——资源枯竭、有劲使不出、说的话没人信（有言不信）。困卦的亨是另一种亨：身处困局而操守不失（贞），大人自吉——困住的是处境，困不住的是人格与定力。", zhan:"得困，资源紧张、局面对你不利的阶段：此时多说无益（有言不信），少表态、多做事、守住底线。困是筛子——筛掉撑不住的人；撑住的大人吉，出困后就是你的局。" },
  水风井: { xiang:"上坎（水）下巽（木）—— 木上有水，井养而不穷", guaci:"井：改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。", yi:"井是井：村邑会迁、井不搬家——稳定的供给之源，无丧无得、往来井井（大家轮着打水，井水不竭）。井卦的关键在最后一哆嗦：水快打上来时打翻瓶子（羸其瓶，凶）——功亏一篑最可惜。", zhan:"得井，做井的事：打造稳定供给的能力（内容源、渠道、口碑），不随热点搬家。同时盯住执行末端——差最后一步交付失败，前面全白费；善始更要善终。" },
  泽火革: { xiang:"上兑（泽）下离（火）—— 火燃泽涸，水火相息，变革之象", guaci:"革：巳日乃孚。元亨利贞，悔亡。", yi:"革是变革：水火相息——旧秩序到头了，必须换。变革最难是信（孚）：巳日乃孚——要等到时机成熟、用一段时间证明给大家看，信才建立。变革做到位，元亨利贞，连后悔都消失（悔亡）。", zhan:"得革，变革窗口开了：转型、改版、换赛道、破旧立新。两件事决定成败：时机（等巳日，别抢跑）与信任（用事实一步步换人心）。顺天应人而革，大吉。" },
  火风鼎: { xiang:"上离（火）下巽（木）—— 木上有火，烹饪成新，鼎新之象", guaci:"鼎：元吉，亨。", yi:"鼎是鼎：炊器而礼器——把生的烹成熟的，把旧的炼成新的（鼎新）。革是破，鼎是立：变革之后建立新秩序、养贤养士（鼎中烹物）。六十四卦里元吉不多见，鼎得其一。", zhan:"得鼎，宜立不宜破：搭新架子、建新体系、立新规矩、养人成事。变革已过或正收尾，现在是把成果烹熟的阶段——稳火慢工，元吉亨通。" },
  震为雷: { xiang:"上震（雷）下震（雷）—— 重雷交作，动而有威", guaci:"震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。", yi:"震是动、是震动：雷声滚滚——惊吓（震来虩虩）与常态（笑言哑哑）并存。震的修养在震惊百里不丧匕鬯：惊雷炸到耳边，手里的酒勺不洒——大事临头，稳得住的人才接得住震后的亨通。", zhan:"得震，突发与变动来了：消息、变故、波及面不小。别慌——震动是洗牌，稳住自己那一亩三分地（不丧匕鬯），动中取机；慌了阵脚的人，会被震出局。" },
  艮为山: { xiang:"上艮（山）下艮（山）—— 两山相重，止而又止", guaci:"艮：艮其背，不获其身；行其庭，不见其人。无咎。", yi:"艮是止、是停：两山叠立——该停就停，止得其所。艮的止不是僵硬，是艮其背：注意力放在该放的地方，无视无关的人和事（不获其身、不见其人）。止的定力到位，无咎。", zhan:"得艮，宜停不宜动：暂停、观望、守住阵地。停要停得专——目标收回自身、屏蔽干扰源。不是放弃，是像山一样立住：该动的时候在，不该动的时候稳如泰山。" },
  风山渐: { xiang:"上巽（木）下艮（山）—— 木生山上，渐次而高", guaci:"渐：女归吉，利贞。", yi:"渐是渐进：树在山上一年长一轮——按次序、按节奏地进。卦辞用嫁娶作比（女归吉）：一切按礼数、按程序来——快不得、跳不得。循序渐进看着慢，实则每一步都作数，利贞。", zhan:"得渐，宜按部就班：流程走到哪算哪、关系处到哪算哪，别催熟、别跳级。此卦最忌抢——把节奏踩对，慢就是快，终局自然吉。" },
  雷泽归妹: { xiang:"上震（长男）下兑（少女）—— 少女随长男，失序相从", guaci:"归妹：征凶，无攸利。", yi:"归妹是嫁妹：关系有了，但次序乱了——不是按正礼走的结合。征凶：这种情况下主动进攻、向前冒进必凶，无攸利。归妹的警示：名不正、序不对的结合（合作、关系、交易），后患在结构里。", zhan:"得归妹，一段关系或合作的出身不正：仓促、错位、越过程序。此时最忌进攻性动作（征凶）——先停、先正名、把次序理顺；理不顺就及时收，硬往前走必伤。" },
  雷火丰: { xiang:"上震（雷）下离（火）—— 雷电皆至，光明盛大", guaci:"丰：亨。王假之，勿忧，宜日中。", yi:"丰是丰盛：雷与电都到位——事业、声势、成果的顶点。但丰卦通篇讲盛极而衰的隐忧：宜日中——正午最好，也意味着此后每一分钟都在偏西。勿忧：守着正位（王假之），不必焦虑。", zhan:"得丰，正处收获与声势的顶点：享受它、用它（王假之——拿丰盛的势去号令资源）。同时清醒：日中则昃——顶点之后就是下坡，趁正午把该定的定下来、该传的传出去。" },
  火山旅: { xiang:"上离（火）下艮（山）—— 火燃山上，居无定所", guaci:"旅：小亨。旅贞吉。", yi:"旅是旅行、旅居：火在山上烧——烧过就过，不常驻。旅的状态：不在自己的地盘、资源有限、一切都小一号——小亨（小通）、旅贞吉（在别人的地盘守正才吉）。旅人最忌张扬与纠缠。", zhan:"得旅，客居、外乡、临时的状态：出差、驻外、借平台、过渡期。姿态放低、守正少事，能得小通；别在别人的地盘争大头、结深仇——旅途的赢，是顺利到达下一站。" },
  巽为风: { xiang:"上巽（风）下巽（风）—— 顺风相随，无孔不入", guaci:"巽：小亨。利有攸往，利见大人。", yi:"巽是风：顺、入、渗透——不正面强攻，顺着缝隙进去。两巽相随：柔顺不是软弱，是持续的渗透力。小亨：巽做不成大开大合的事，但利有攸往、利见大人——以柔进、借力上行，路是通的。", zhan:"得巽，宜软着陆、宜渗透、宜借势：硬碰硬的事别接，顺着形势、贴着关键人物（利见大人）走，柔能通到刚到不了的地方。记住巽是小的功夫——积小胜、少露锋。" },
  兑为泽: { xiang:"上兑（泽）下兑（泽）—— 两泽相连，互相滋润", guaci:"兑：亨，利贞。", yi:"兑是泽、是悦：两泽相连、彼此滋养——交流带来的喜悦。兑的亨通在以和为贵的表达与交换：丽泽兑，君子以朋友讲习。但悦有边界：利贞——正当地悦则亨，谄媚讨好则失格。", zhan:"得兑，宜交流、社交、谈合作、做表达：气氛好、人心悦，事好谈。守住贞——真诚正直的喜悦凝聚人，酒肉谄媚聚不来真盟友。两泽相连：找到能互相滋养的对象。" },
  风水涣: { xiang:"上巽（风）下坎（水）—— 风行水上，涣然冰释", guaci:"涣：亨。王假有庙，利涉大川，利贞。", yi:"涣是涣散：风吹水面——离散、消散、人心浮动。涣卦的应对恰与萃同源：王假有庙——用精神旗帜把散掉的人心重新聚起来；利涉大川——聚起正气，反倒能乘势渡大难关。", zhan:"得涣，出现人心散、队伍松、资产流失的迹象：赶紧立庙——重申共同目标、重构仪式感与归属感。散中有渡大川的机会（借风行船），聚住核心人马即可用势。" },
  水泽节: { xiang:"上坎（水）下兑（泽）—— 泽有容水之限，节制之象", guaci:"节：亨。苦节不可贞。", yi:"节是节制：泽装水有度——制度、分寸、边界。节则亨：资源有限，会分配的赢。但卦辞补一句狠的：苦节不可贞——节到苦自己的程度（过度省、过度压抑），不可持久，反而失正。节是刚刚好，不是越少越好。", zhan:"得节，立规矩、定预算、控节奏的时候：该限的限、该省的省，制度一立则亨通。底线是别苦节——把自己或团队勒到没余地，规矩本身会崩；留出生动的余地。" },
  风泽中孚: { xiang:"上巽（风）下兑（泽）—— 风感泽应，中心诚信", guaci:"中孚：豚鱼吉。利涉大川，利贞。", yi:"中孚是中心诚信：诚信到连豚鱼这般微贱之物都被感化（豚鱼吉）——真诚不是姿态，是由内而外的气场。信立则大险可渡（利涉大川）——信任是最强的通行证。", zhan:"得中孚，诚信是这一局的核心资产：说到做到、表里如一，连最挑剔的对象都会被打动。可渡大难关、可托付大事。检查所有承诺——此卦兑现一笔，信用涨一分。" },
  雷山小过: { xiang:"上震（雷）下艮（山）—— 雷在山上，小有所过", guaci:"小过：亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。", yi:"小过是小有所过：小事上可以略超规格（可小事），大事不行（不可大事）。飞鸟的比喻：鸟往上飞声音越远越危，往下飞就近于安——不宜上宜下：姿态放低、往实处落，大吉。", zhan:"得小过，宜做小、做实、做细：小动作、小让步、小超越皆吉；大决策、大投入、大排场缓行。凡事往下走（贴地、贴用户、贴细节），飞太高必失声。" },
  水火既济: { xiang:"上坎（水）下离（火）—— 水在火上，炊煮既成", guaci:"既济：亨小，利贞。初吉终乱。", yi:"既济是已成：水火相济、六爻皆当位——事情办成了。但卦辞冷峻：亨小（成的是小事态）、初吉终乱——成功的局面天生走向松懈：每一步都对位，恰恰是乱象滋生之际。守成比打江山难。", zhan:"得既济，事已成：值得庆祝，更值得警惕——终乱是既济的宿命曲线。成功当刻就开始防松弛：复盘、立新目标、盯住当初最顺的环节（顺的环节最易出事）。" },
  火水未济: { xiang:"上离（火）下坎（水）—— 火在水上，六爻皆不当位", guaci:"未济：亨。小狐汔济，濡其尾，无攸利。", yi:"未济是未成：六十四卦的最后一卦不是完成，是还没完成——小狐狸快渡到对岸，打湿了尾巴（濡其尾）。但未济亨：未完才有未来，六爻皆不当位却充满可能性。易经以未济收尾——永远在路上。", zhan:"得未济，事近而未成：差最后一段。此刻最怕急（小狐濡其尾——最后关头乱了节奏）：沉住气、收着劲、按步骤收尾。未成不是败——保持动态，路还长，空间还大。" }
};

/* ===== 六爻排盘 · 引擎层 v0.1.3（对应 docs/ALGORITHM.md §1–§9、§11）===== */

/* ---------- 历法原语（与八字/奇门同源） ---------- */
var MONTH_START = { 0:2, 5:2, 1:4, 6:4, 2:6, 7:6, 3:8, 8:8, 4:0, 9:0 };
var SHI_START   = { 0:0, 5:0, 1:2, 6:2, 2:4, 7:4, 3:6, 8:6, 4:8, 9:8 };
var S_TERM_NAME = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至',
                   '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
var JQ_MDZ = { 立春:2, 雨水:2, 惊蛰:3, 春分:3, 清明:4, 谷雨:4, 立夏:5, 小满:5, 芒种:6, 夏至:6,
               小暑:7, 大暑:7, 立秋:8, 处暑:8, 白露:9, 秋分:9, 寒露:10, 霜降:10, 立冬:11, 小雪:11,
               大雪:0, 冬至:0, 小寒:1, 大寒:1 };

function jd(y, m, d) {
  var a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
function dayIdx(y, m, d) { return ((jd(y, m, d) + 49) % 60 + 60) % 60; }
function shichenIdx(h) { return Math.floor((h + 1) / 2) % 12; }
function yearGz(y) { return ((y - 4) % 60 + 60) % 60; }
function monthTg(ygIdx, mdz) { return ((MONTH_START[((ygIdx % 10) + 10) % 10] + mdz - 2) % 10 + 10) % 10; }
function shiTg(di, sc) { return ((SHI_START[((di % 10) + 10) % 10] + sc) % 10 + 10) % 10; }
function jiaziIdx(tg, dz) { for (var k = 0; k < 60; k++) if (k % 10 === tg && k % 12 === dz) return k; return -1; }

function getSolarTerm(y, n) {
  // n: 0=小寒 … 23=冬至；返回 Date（UTC 字段 = 北京钟表时间）
  var idx = (y - 1000) * 24 + n, packed = SOLAR_TERMS[idx];
  if (packed === undefined) return null;
  var days = Math.trunc(packed / 86400), secs = packed % 86400;
  if (secs < 0) { secs += 86400; days -= 1; }
  return new Date(Date.UTC(2000, 0, 1) + days * 86400000 + secs * 1000 - 288e5);
}
function getJq(y, m, d, h, mi) {
  var t = Date.UTC(y, m - 1, d, h || 0, mi || 0), name = '冬至', lastT = -Infinity;
  for (var yy = y - 1; yy <= y; yy++) {
    for (var i = 0; i < 24; i++) {
      var st = getSolarTerm(yy, i);
      if (st && t >= st.getTime() && st.getTime() >= lastT) { name = S_TERM_NAME[i]; lastT = st.getTime(); }
    }
  }
  return name;
}

/* 四柱：年（立春分界）、月（节气）、日（子时换日）、时 */
function computePillars(y, m, d, h, mi) {
  h = h || 0; mi = mi || 0;
  var sc = shichenIdx(h);
  var di = dayIdx(y, m, (h >= 23) ? d + 1 : d);
  var lichun = getSolarTerm(y, 2);
  var cur = Date.UTC(y, m - 1, d, h, mi);
  var yy = (lichun && cur < lichun.getTime()) ? y - 1 : y;
  var yg = yearGz(yy);
  var jq = getJq(y, m, d, h, mi);
  var mdz = JQ_MDZ[jq];
  var mtg = monthTg(yg, mdz);
  var mgz = jiaziIdx(mtg, mdz);
  var stg = shiTg(di, sc);
  var sgz = jiaziIdx(stg, sc);
  var xun = Math.floor(di / 10) * 10;
  var kong = [DZ[(xun + 10) % 12], DZ[(xun + 11) % 12]];
  var mxun = Math.floor(mgz / 10) * 10;
  var mkong = [DZ[(mxun + 10) % 12], DZ[(mxun + 11) % 12]];
  return {
    y: yy, m: m, d: d, h: h, mi: mi, sc: sc, jq: jq,
    yg: yg, yz: yg % 12, mgz: mgz, mdz: mdz, di: di, riGan: TG[di % 10], riZhi: DZ[di % 12],
    stg: stg, sgz: sgz, kong: kong, mkong: mkong,
    pillars: [JIAZI[yg], JIAZI[mgz], JIAZI[di], JIAZI[sgz]]
  };
}

/* 十二长生（§7.1）：金水木火以五行取阳干顺行；土分阴阳（v0.1.78 邦顺裁决）——
   阳土（艮宫·辰戌）走戊线：长生在午顺行（未沐浴、戌帝旺）；阴土（坤宫·丑未）走己线：长生在巳逆行（辰沐浴、丑帝旺）；
   yin 由调用方按主体定：支/宫名/卦名过 tuYin（坤·丑·未＝阴） */
function tuYin(n) { return n === "坤" || n === "丑" || n === "未"; }
function changSheng(wx, zhi, yin) {
  var start, dir = 1;
  if (wx === "土") {
    if (yin) { start = DZ.indexOf("巳"); dir = -1; }
    else start = DZ.indexOf("午");
  } else start = DZ.indexOf(GAN_CS_START[WX_YANG_GAN[wx]]);
  var i = ((DZ.indexOf(zhi) - start) * dir + 120) % 12;
  return CHANGSHENG[i];
}

/* 月令生克 → 旺相休囚死（与十二长生双轨并行；冲突时以本口径为准） */
function monthState(wx, mdz, yzhi) {
  var mw = ZHI_WX[mdz];
  if (yzhi === mdz) return { rel: "临月建", level: "旺", wang: true, val: 3 };
  if (mw === wx) return { rel: "比和月令", level: "旺", wang: true, val: 3 };
  if (WX_SHENG[mw] === wx) return { rel: "月令生我", level: "相", wang: true, val: 2 };
  if (WX_SHENG[wx] === mw) return { rel: "我生月令", level: "休", wang: false, val: 0 };
  if (WX_KE[wx] === mw) return { rel: "我克月令", level: "囚", wang: false, val: -1 };
  return { rel: "月令克我", level: "死", wang: false, val: -2 };
}

/* 通根：五行对支按藏干求根 —— 本气位＝本气根、中气位＝中气根、余气位＝余气根，不在＝无根 */
function tongGen(wx, zhi) {
  var kind = ["本气根", "中气根", "余气根"], cang = ZHI_CANG[zhi] || [];
  for (var i = 0; i < cang.length; i++) if (GAN_WX[cang[i]] === wx) return kind[i] + wx;
  return "无根";
}

/* 卦生克（v0.1.99，原整卦旺衰五态换名）：半卦五行受整卦（宫）五行生克——卦我比和（最强）、卦生我（三强）、我克卦（次强）、我生卦（次弱）、卦克我（最弱） */
function gongState(wx, gwx) {
  if (wx === gwx) return { rel: "同宫五行", level: "卦我比和" };
  if (WX_SHENG[gwx] === wx) return { rel: gwx + "生" + wx, level: "卦生我" };
  if (WX_KE[gwx] === wx) return { rel: gwx + "克" + wx, level: "卦克我" };
  if (WX_SHENG[wx] === gwx) return { rel: wx + "生" + gwx, level: "我生卦" };
  return { rel: wx + "克" + gwx, level: "我克卦" };
}

/* 日令生克比五型文案（v0.1.79 按月令做法加「我」）：比和＝比和X日、日生＝X日生我、日克＝X日克我、我生＝我生X日、我克＝我克X日（§A5） */
function riShengKeText(wx, rzhi) {
  var rw = ZHI_WX[rzhi];
  if (rw === wx) return "比和" + rzhi + "日";
  if (WX_SHENG[rw] === wx) return rzhi + "日生我";
  if (WX_KE[rw] === wx) return rzhi + "日克我";
  if (WX_SHENG[wx] === rw) return "我生" + rzhi + "日";
  return "我克" + rzhi + "日";
}

/* 半卦级：世应所在三爻卦的本变结构（半卦五行／本变五型／月旺衰／日旺衰／整卦旺衰），供得失分析与四层判定复用 */
function halfLevel(g) {
  var a = g.info, b = g.bian ? g.bian.info : null;
  var mzh = DZ[g.cal.mdz], rzh = g.cal.riZhi;
  function side(tri, refGwx) {
    var wx = GONG_WX[tri.n];
    var yue = monthState(wx, mzh, null);
    return { n: tri.n, wx: wx,
      yue: yue,
      ri: monthState(wx, rzh, null),
      zheng: gongState(wx, refGwx) };
  }
  function pair(tri, btri, gwx, bgwx) {
    var p = { ben: side(tri, gwx), bian: null, md: null };
    if (btri) {
      p.bian = side(btri, bgwx);
      p.md = WX_MODE[wxRelation(p.ben.wx, p.bian.wx)];
    }
    return p;
  }
  return { shiUp: SEQ_SHI[a.seq] > 3,
    up: pair(a.upper, b && b.upper, a.gongWx, b && b.gongWx),
    low: pair(a.lower, b && b.lower, a.gongWx, b && b.gongWx) };
}

/* ---------- 八卦 / 八宫 ---------- */
function flipBits(bits, idxs) {
  var a = bits.split('');
  for (var k = 0; k < idxs.length; k++) { var i = idxs[k]; a[i] = (a[i] === '1') ? '0' : '1'; }
  return a.join('');
}
var GONG_MAP = {};
(function buildGongMap() {
  for (var g = 0; g < 8; g++) {
    var pure = TRI[g], base = pure.b + pure.b, seqs = [];
    seqs[0] = base;
    seqs[1] = flipBits(base, [0]);
    seqs[2] = flipBits(base, [0, 1]);
    seqs[3] = flipBits(base, [0, 1, 2]);
    seqs[4] = flipBits(base, [0, 1, 2, 3]);
    seqs[5] = flipBits(base, [0, 1, 2, 3, 4]);
    seqs[6] = flipBits(seqs[5], [3]);
    seqs[7] = flipBits(seqs[6], [0, 1, 2]);
    for (var s = 0; s < 8; s++) GONG_MAP[seqs[s]] = { gong: pure.n, seq: s };
  }
})();

function guaInfo(bits) {
  var lower = TRI_BY_BITS[bits.slice(0, 3)], upper = TRI_BY_BITS[bits.slice(3, 6)];
  var info = GONG_MAP[bits];
  return {
    bits: bits, lower: lower, upper: upper,
    name: GUA_NAMES[upper.n + lower.n] || "（未知名）",
    gong: info.gong, gongWx: GONG_WX[info.gong], seq: info.seq, seqName: SEQ_NAME[info.seq]
  };
}

/* 某卦六爻的纳甲干支（不含六亲） */
function najiaYao(bits) {
  var lower = TRI_BY_BITS[bits.slice(0, 3)], upper = TRI_BY_BITS[bits.slice(3, 6)], out = [];
  for (var p = 1; p <= 6; p++) {
    var inner = p <= 3, tri = inner ? lower : upper, nj = NAJIA[tri.n];
    out.push({ pos: p, gan: inner ? nj.ig : nj.og, zhi: inner ? nj.iz[p - 1] : nj.oz[p - 4] });
  }
  for (var k = 0; k < 6; k++) out[k].wx = ZHI_WX[out[k].zhi];
  return out;
}

/* ---------- 装卦 ---------- */
function zhuangGua(bits, states, cal, forceBian) {
  // states: 长度 6 的数组，每项 6/7/8/9（老阴/少阳/少阴/老阳）
  var gi = guaInfo(bits);
  var nj = najiaYao(bits);
  var start = LIUSHEN_START[cal.riGan];
  var yao = [];
  for (var p = 1; p <= 6; p++) {
    var st = states[p - 1];
    yao.push({
      pos: p, gan: nj[p - 1].gan, zhi: nj[p - 1].zhi, wx: nj[p - 1].wx,
      liuqin: liuqinOf(gi.gongWx, nj[p - 1].wx),
      state: st, yang: (st === 7 || st === 9), moving: (st === 6 || st === 9),
      liushen: LIUSHEN[(start + p - 1) % 6],
      shi: (SEQ_SHI[gi.seq] === p), ying: (SEQ_YING[gi.seq] === p),
      bian: null
    });
  }
  var g = { info: gi, yao: yao, cal: cal, moving: [], hasMoving: false, bian: null };
  for (var k = 0; k < 6; k++) if (yao[k].moving) { g.moving.push(k + 1); g.hasMoving = true; }

  /* 变卦：动爻变阴阳；变爻六亲仍以本卦卦宫定（§4）
     forceBian：双端起卦终卦＝始卦（0 动爻）时仍建变卦镜像——参考资料 28 · 起用条件「两端完全相同仍然起用」，记同卦不变 */
  if (g.hasMoving || forceBian) {
    var nb = bits.split('');
    for (var i2 = 0; i2 < 6; i2++) if (yao[i2].moving) nb[i2] = (nb[i2] === '1') ? '0' : '1';
    var bb = nb.join('');
    g.bian = { info: guaInfo(bb), nj: najiaYao(bb) };
    /* 变卦六爻全量：整卦显示用（六亲仍以本卦卦宫定，§4） */
    g.bian.yao = [];
    for (var v = 0; v < 6; v++) {
      var bnj2 = g.bian.nj[v];
      g.bian.yao.push({
        pos: v + 1, gan: bnj2.gan, zhi: bnj2.zhi, wx: bnj2.wx,
        liuqin: liuqinOf(gi.gongWx, bnj2.wx),
        yang: (bb.charAt(v) === '1'), moved: yao[v].moving,
        shi: (SEQ_SHI[g.bian.info.seq] === v + 1), ying: (SEQ_YING[g.bian.info.seq] === v + 1)
      });
    }
    for (var m2 = 0; m2 < 6; m2++) {
      if (!yao[m2].moving) continue;
      var bnj = g.bian.nj[m2];
      var rel = changeRelation(yao[m2], bnj.zhi);
      yao[m2].bian = {
        gan: bnj.gan, zhi: bnj.zhi, wx: bnj.wx,
        liuqin: liuqinOf(gi.gongWx, bnj.wx), rel: rel
      };
    }
    /* 静变爻：本卦静爻而变卦对应爻五行不同者，对标动变爻标回头生克泄耗／化进化退；化空随日令旬空 */
    for (var m3 = 0; m3 < 6; m3++) {
      if (yao[m3].moving) continue;
      var bnj3 = g.bian.nj[m3];
      if (bnj3.wx === yao[m3].wx) continue;
      yao[m3].bianRel = changeRelation(yao[m3], bnj3.zhi);
      yao[m3].bianKong = (cal.kong.indexOf(bnj3.zhi) >= 0);
      yao[m3].bianMkong = (cal.mkong.indexOf(bnj3.zhi) >= 0);
      yao[m3].bianRipo = (LIU_CHONG[bnj3.zhi] === cal.riZhi);
      yao[m3].bianYuepo = (LIU_CHONG[bnj3.zhi] === DZ[cal.mdz]);
      yao[m3].bianHeRi = (LIU_HE[bnj3.zhi] === cal.riZhi);
      yao[m3].bianHeYue = (LIU_HE[bnj3.zhi] === DZ[cal.mdz]);
      yao[m3].bianXingRi = xingRel(bnj3.zhi, cal.riZhi);
      yao[m3].bianHaiRi = haiRel(bnj3.zhi, cal.riZhi);
      yao[m3].bianXingYue = xingRel(bnj3.zhi, DZ[cal.mdz]);
      yao[m3].bianHaiYue = haiRel(bnj3.zhi, DZ[cal.mdz]);
      yao[m3].bianTuRef = ((yao[m3].bianRel === "化进" || yao[m3].bianRel === "化退") && ZHI_WX[yao[m3].zhi] === "土");
    }
  }

  /* 伏神：本卦未出现的六亲，回本宫首卦同爻位取（§6） */
  var pureBits = TRI_BY_NAME[gi.gong].b + TRI_BY_NAME[gi.gong].b;
  var pureNj = najiaYao(pureBits);
  var present = {};
  for (var q = 0; q < 6; q++) present[yao[q].liuqin] = true;
  g.fu = [];
  for (var l = 0; l < LQ_ORDER.length; l++) {
    var lq = LQ_ORDER[l];
    if (present[lq]) continue;
    for (var r = 0; r < 6; r++) {
      var pLq = liuqinOf(GONG_WX[gi.gong], pureNj[r].wx);
      if (pLq !== lq) continue;
      var fei = yao[r];
      g.fu.push({
        pos: r + 1, liuqin: lq, gan: pureNj[r].gan, zhi: pureNj[r].zhi, wx: pureNj[r].wx,
        feiGan: fei.gan, feiZhi: fei.zhi, feiWx: fei.wx, feiLiuqin: fei.liuqin,
        rel: wxRelText(pureNj[r].wx, fei.wx)
      });
    }
  }
  return g;
}

function changeRelation(yao, bzhi) {
  var bw = ZHI_WX[bzhi], ow = yao.wx;
  if (bw === ow) {
    if (JIN_SHEN[yao.zhi] === bzhi) return "化进";
    if (TUI_SHEN[yao.zhi] === bzhi) return "化退";
    return "比和";
  }
  if (WX_SHENG[bw] === ow) return "回头生";
  if (WX_KE[bw] === ow) return "回头克";
  if (WX_SHENG[ow] === bw) return "化泄";
  return "化耗";
}

/* ---------- 状态层（§7） ---------- */
function computeState(g, opt) {
  var cal = g.cal, refZhi = opt.refZhi, muRef = opt.muRef || [], kong = cal.kong;
  var mdz = DZ[cal.mdz], rdz = cal.riZhi;
  g.refZhi = refZhi; g.refLabel = opt.refLabel || "月建"; g.muRef = muRef;
  // 第一遍：动静 / 空破墓 —— 必须先算完，强弱才有所依据
  for (var k = 0; k < 6; k++) {
    var y = g.yao[k];
    y.cs = changSheng(y.wx, refZhi, tuYin(y.zhi));
    y.csLevel = CS_LEVEL[y.cs];
    var ms = monthState(y.wx, mdz, y.zhi);
    y.monthRel = ms.rel; y.monthLevel = ms.level; y.wang = ms.wang; y.wangVal = ms.val;
    y.kong = (kong.indexOf(y.zhi) >= 0);
    y.mkong = (cal.mkong.indexOf(y.zhi) >= 0);
    y.mu = [];
    for (var m = 0; m < muRef.length; m++) if (WX_MU[y.wx] === muRef[m].zhi) y.mu.push(muRef[m].label + "墓");
    y.muKind = y.mu.length ? (y.wang ? "入库" : "入墓") : "";
    y.chongRi = (LIU_CHONG[y.zhi] === rdz);
    y.chongYue = (LIU_CHONG[y.zhi] === mdz);
    y.heRi = (LIU_HE[y.zhi] === rdz);
    y.heYue = (LIU_HE[y.zhi] === mdz);
    y.xingRi = xingRel(y.zhi, rdz);
    y.haiRi = haiRel(y.zhi, rdz);
    y.xingYue = xingRel(y.zhi, mdz);
    y.haiYue = haiRel(y.zhi, mdz);
    /* 日冲单维（v0.2.20）：静爻被日辰冲＝日冲，不分旺衰生扶；冲日＝爻冲日令，动爻标「冲日」 */
    y.ripo = (!y.moving && y.chongRi);
    y.yuepo = (!y.moving && y.chongYue);
    /* 虚实四态（§19）：实＝旺相且不空破墓；虚＝休囚且空破墓；半实半虚＝旺相但空破（待时）；半虚半实＝休囚但未空破（力小可用）。日冲不参与（v0.2.20 单维标志） */
    var broken = (y.kong || y.yuepo || y.muKind === "入墓");
    y.xuShi = y.wang ? (broken ? "半实半虚" : "实") : (broken ? "虚" : "半虚半实");
    /* 空分真假（§19/§20）：旺相空＝假空（待出空填实）；休囚空＝真空 */
    y.kongKind = y.kong ? (y.wang ? "假空" : "真空") : "";
    /* 日合静爻（§19 动静五类）：旺相＝合起（激活）；休囚＝合绊（牵制） */
    y.heQi = (!y.moving && (y.heRi || y.heYue)) ? (y.wang ? "合起" : "合绊") : "";
    if (y.bian) {
      y.bian.cs = changSheng(y.bian.wx, refZhi, tuYin(y.bian.zhi));
      y.bian.csLevel = CS_LEVEL[y.bian.cs];
      var bms = monthState(y.bian.wx, mdz, y.bian.zhi);
      y.bian.monthLevel = bms.level; y.bian.wang = bms.wang;
      y.bian.kong = (kong.indexOf(y.bian.zhi) >= 0);
      y.bian.mu = [];
      for (var m2 = 0; m2 < muRef.length; m2++) if (WX_MU[y.bian.wx] === muRef[m2].zhi) y.bian.mu.push(muRef[m2].label + "墓");
      y.bian.muKind = y.bian.mu.length ? (y.bian.wang ? "入库" : "入墓") : "";
      y.bian.fuYin = (y.bian.zhi === y.zhi);
      if (y.bian.rel === "化进") y.bian.jinReal = y.wang;
      if (y.bian.rel === "化退") y.bian.tuiReal = y.wang;
      y.bian.tuRef = ((y.bian.rel === "化进" || y.bian.rel === "化退") && ZHI_WX[y.zhi] === "土");
      y.bian.mkong = (cal.mkong.indexOf(y.bian.zhi) >= 0);
      y.bian.heRi = (LIU_HE[y.bian.zhi] === rdz);
      y.bian.heYue = (LIU_HE[y.bian.zhi] === mdz);
      y.bian.xingRi = xingRel(y.bian.zhi, rdz);
      y.bian.haiRi = haiRel(y.bian.zhi, rdz);
      y.bian.xingYue = xingRel(y.bian.zhi, mdz);
      y.bian.haiYue = haiRel(y.bian.zhi, mdz);
      /* 变爻地支层（八法关系组＋状态组）：化冲合刑害对原爻；化月冲化日冲对月日；化绝看长生 */
      y.bian.zhiChong = (LIU_CHONG[y.bian.zhi] === y.zhi);
      y.bian.zhiHe = (LIU_HE[y.bian.zhi] === y.zhi);
      y.bian.zhiXing = xingRel(y.bian.zhi, y.zhi);
      y.bian.zhiHai = haiRel(y.bian.zhi, y.zhi);
      y.bian.yuepo = (LIU_CHONG[y.bian.zhi] === mdz);
      y.bian.ripo = (LIU_CHONG[y.bian.zhi] === rdz);
      y.bian.jue = (y.bian.cs === "绝");
    }
  }
  // 第二遍：强弱（日令 + 动爻）
  for (var k2 = 0; k2 < 6; k2++) {
    var s = strengthOf(g, g.yao[k2]);
    g.yao[k2].net = s.net; g.yao[k2].strongNotes = s.notes; g.yao[k2].strength = strengthLabel(s.net);
  }
  for (var f = 0; f < g.fu.length; f++) {
    var fu = g.fu[f];
    fu.kong = (kong.indexOf(fu.zhi) >= 0);
    fu.cs = changSheng(fu.wx, refZhi, tuYin(fu.zhi));
    fu.csLevel = CS_LEVEL[fu.cs];
    fu.wang = monthState(fu.wx, mdz, fu.zhi).wang;
  }
  /* 卦级：反吟 / 伏吟 */
  var za = [], zb = [];
  for (var fz = 0; fz < 6; fz++) { za.push(g.yao[fz].zhi); if (g.bian) zb.push(g.bian.yao[fz].zhi); }
  g.fanFuYin = fanFuYin(za, g.bian ? zb : null);
  g.guaChongHe = chongHeGua(za);
  var mvn = g.moving.length;
  g.structType = mvn === 0 ? "全静" : mvn === 6 ? "全动" : mvn === 1 ? "独发" : mvn === 5 ? "独静" : "";
  g.sanHeJu = sanHeJu(g, cal);
  g.bianFuYin = [];
  for (var fy = 0; fy < 6; fy++) {
    if (g.yao[fy].bian && g.yao[fy].bian.fuYin) g.bianFuYin.push(g.yao[fy].pos);
  }
  g.half = halfLevel(g);
  return g;
}

function strengthOf(g, y) {
  var net = 0, notes = [];
  function apply(srcWx, label) {
    if (srcWx === y.wx) { net += 1; notes.push(label + " " + srcWx + " 同类相助"); return; }
    if (WX_SHENG[srcWx] === y.wx) { net += 1; notes.push(label + " " + srcWx + " 生我"); return; }
    if (WX_SHENG[y.wx] === srcWx) { net -= 1; notes.push(label + " " + srcWx + " 泄我"); return; }
    if (WX_KE[y.wx] === srcWx) { net -= 1; notes.push(label + " " + srcWx + " 耗我"); return; }
    net -= 2; notes.push(label + " " + srcWx + " 克我");
  }
  apply(ZHI_WX[g.cal.riZhi], "日令" + g.cal.riZhi);
  for (var k = 0; k < 6; k++) {
    var o = g.yao[k];
    if (o.pos === y.pos || !o.moving) continue;
    apply(o.wx, YAO_POS_NAME[o.pos - 1] + o.gan + o.zhi + "（动）");
  }
  return { net: net, notes: notes };
}
function strengthLabel(net) {
  if (net >= 2) return "强";
  if (net === 1) return "偏强";
  if (net === 0) return "平";
  if (net === -1) return "偏弱";
  return "弱";
}

/* ---------- 关系工具 ---------- */
var YAO_POS_NAME = ["初爻", "二爻", "三爻", "四爻", "五爻", "上爻"];

function yaoRelText(a, b) {           // a 对 b 的作用：真假前缀＋五行关系＋地支合冲刑害
  var t = wxRelText(a.wx, b.wx), ex = [];
  if (LIU_CHONG[a.zhi] === b.zhi) ex.push("相冲");
  if (LIU_HE[a.zhi] === b.zhi) ex.push("相合");
  var hz = haiRel(a.zhi, b.zhi); if (hz) ex.push(hz);
  var xz = xingRel(a.zhi, b.zhi); if (xz) ex.push(xz);
  var sh = sanHeRel(a.zhi, b.zhi); if (sh) ex.push(sh);
  /* 真假（§19）：施力方空破墓或被日合绊，作用不实 —— 看着有，实际无；比和为同气不施受，不标真假。日冲不参与（v0.2.20 单维标志） */
  var fake = (a.kong || a.yuepo || a.muKind === "入墓" || a.heQi === "合绊");
  var pre = (t.indexOf("比和") >= 0) ? "" : (fake ? "假" : "真");
  return pre + t + (ex.length ? "·" + ex.join("·") : "");
}

/* 三合两支关系：生半合（长生＋帝旺）／墓半合（帝旺＋墓库）／拱合（长生＋墓库） */
function sanHeRel(a, b) {
  if (a === b) return "";
  for (var i = 0; i < SAN_HE.length; i++) {
    var s = SAN_HE[i], ia = s.zhi.indexOf(a), ib = s.zhi.indexOf(b);
    if (ia < 0 || ib < 0) continue;
    var lo = Math.min(ia, ib), hi = Math.max(ia, ib);
    if (lo === 0 && hi === 1) return "生半合" + s.wx;
    if (lo === 1 && hi === 2) return "墓半合" + s.wx;
    if (lo === 0 && hi === 2) return "拱合" + s.wx;
  }
  return "";
}
function xingRel(a, b) {
  if (a === b) return (ZI_XING.indexOf(a) >= 0) ? "自刑" : "";
  for (var i = 0; i < SAN_XING.length; i++) {
    if (SAN_XING[i].indexOf(a) >= 0 && SAN_XING[i].indexOf(b) >= 0) return "相刑";
  }
  if ((a === "子" && b === "卯") || (a === "卯" && b === "子")) return "相刑";
  return "";
}
function haiRel(a, b) { return (LIU_HAI[a] === b) ? "相害" : ""; }

/* 反吟／伏吟：本卦与变卦对应爻位地支「全冲」为反吟、「全同」为伏吟 */
function fanFuYin(za, zb) {
  if (!zb) return "";
  var fullC = true, fullS = true, inC = true, outC = true, inS = true, outS = true;
  for (var k = 0; k < 6; k++) {
    var c = (LIU_CHONG[za[k]] === zb[k]), s = (za[k] === zb[k]);
    if (!c) fullC = false;
    if (!s) fullS = false;
    if (k < 3) { if (!c) inC = false; if (!s) inS = false; }
    else { if (!c) outC = false; if (!s) outS = false; }
  }
  var hits = [];

function distLabel(a, b) { return Math.abs(a.pos - b.pos) === 1 ? "相邻" : "隔位"; }

/* 六亲关系强弱四维度（§14） */
function relStrength(g, a, b) {
  var score = 0, dims = [];

  var sOk = (a.strength === "强" || a.strength === "偏强");
  if (ax >= 2 && sOk) { score += 2; dims.push("施力方旺且强"); }
  else if (ax >= 1 || sOk) { score += 1; dims.push("施力方能量中等"); }
  else dims.push("施力方衰且弱");
  if (distLabel(a, b) === "相邻") { score += 1; dims.push("相邻"); } else dims.push("隔位");
  if (a.moving) { score += 1; dims.push("动爻"); } else dims.push("静爻");
  if (a.kong || a.yuepo || a.muKind === "入墓" || a.heQi === "合绊") { score -= 2; dims.push("施力方空破合绊·作用不实"); }
  if (LIU_CHONG[a.zhi] === b.zhi) { score += 1; dims.push("相冲"); }
  else if (LIU_HE[a.zhi] === b.zhi) { score += 1; dims.push("相合"); }
  var label = score >= 5 ? "决定性" : (score >= 4 ? "较强" : (score >= 3 ? "一般" : "微弱"));
  return { score: score, label: label, dims: dims };
}

/* ---------- 双端起卦（参考资料 27 · 0007 双端独立抽卦法 v1.0.0） ----------
   始卦、终卦分别从 0–63 独立等概率抽取（终卦不排除始卦，允许同卦与 0–6 个动爻），
   动爻＝两端编码 XOR 反推。编码：0＝阴 1＝阳，低位＝初爻。
   抽取必须 crypto 级（rng 仅测试注入），禁 Math.random 与时间戳取余。 */
var DUAL_METHOD = "independent_dual_hexagram", DUAL_VERSION = "1.0.0";
function randCode64(rng) {
  if (rng) return rng() & 63;
  var b = new Uint8Array(1);
  crypto.getRandomValues(b);
  return b[0] & 63;
}
function codeToBits(code) {
  var s = "";
  for (var i = 0; i < 6; i++) s += ((code >> i) & 1) ? "1" : "0";
  return s;
}
function bitsToCode(bits) {
  var c = 0;
  for (var i = 0; i < 6; i++) if (bits.charAt(i) === "1") c |= (1 << i);
  return c;
}
function dualDraw(startCode, endCode) {
  var mask = startCode ^ endCode, lines = [];
  for (var i = 0; i < 6; i++) if ((mask >> i) & 1) lines.push(i + 1);
  return { method: DUAL_METHOD, algorithmVersion: DUAL_VERSION,
    startCode: startCode, endCode: endCode,
    changingMask: mask, changingLines: lines, changingCount: lines.length,
    isSameHexagram: startCode === endCode };
}
/* 两端 → 六爻值：始终同爻＝少（阳7阴8），异爻＝老（始阳9始阴6）——
   老爻即动，装卦后变卦必等于抽取的终卦 */
function dualStates(startCode, endCode) {
  var sb = codeToBits(startCode), eb = codeToBits(endCode), out = [];
  for (var i = 0; i < 6; i++) {

    else out.push(sb.charAt(i) === "1" ? 9 : 6);
  }
  return out;
}

/* 用神选取（§11） */
function pickYongShen(g, ruleKey) {
  var rule = null;
  for (var i = 0; i < YONGSHEN_RULES.length; i++) if (YONGSHEN_RULES[i].key === ruleKey) rule = YONGSHEN_RULES[i];
  if (!rule) rule = YONGSHEN_RULES[0];

  if (rule.lq === "世爻" || rule.lq === "应爻") {
    for (var k = 0; k < 6; k++) if ((rule.lq === "世爻" ? g.yao[k].shi : g.yao[k].ying)) cands.push(g.yao[k]);
  } else {
    for (var k2 = 0; k2 < 6; k2++) if (g.yao[k2].liuqin === rule.lq) cands.push(g.yao[k2]);
  }
  if (!cands.length) return { rule: rule, cands: [], pick: null, note: "本卦中该六亲不上卦 —— 见伏神（" + rule.lq + "）" };
  /* 两现取用六环（§20）：动 > 旺 > 空破 > 临世应 > 有生扶 > 近世，逐环收窄 */
  var pickList = cands.slice(), ringHit = "";
  function narrow(f, name) {
    if (pickList.length < 2) return;
    var hit = [];
    for (var i = 0; i < pickList.length; i++) if (f(pickList[i])) hit.push(pickList[i]);
    if (hit.length >= 1 && hit.length < pickList.length) { pickList = hit; ringHit = name; }
  }
  narrow(function (c) { return c.moving; }, "动");
  narrow(function (c) { return c.wang; }, "旺");
  narrow(function (c) { return c.kong || c.yuepo || c.ripo; }, "空破");
  narrow(function (c) { return c.shi || c.ying; }, "世应");
  narrow(function (c) {
    for (var i = 0; i < g.yao.length; i++) {
      var yy = g.yao[i];
      if (yy !== c && yy.moving && WX_SHENG[yy.wx] === c.wx) return true;
    }
    return false;
  }, "生扶");
  if (pickList.length > 1) {
    var shi = null; for (var s2 = 0; s2 < 6; s2++) if (g.yao[s2].shi) shi = g.yao[s2];
    if (shi) {
      var best = pickList[0], bd = 99;

        var dd = Math.abs(pickList[c2].pos - shi.pos);
        if (dd < bd) { bd = dd; best = pickList[c2]; }
      }
      pickList = [best];
    }

  return {
    rule: rule, cands: cands, pick: pickList[0],
    note: cands.length > 1 ? "同六亲 " + cands.length + " 爻，按取用序（动 > 旺 > 空破 > 世应 > 生扶 > 近世）取 " + pickList[0].pos + " 爻（定于「" + (ringHit || "近世") + "」环）" : ""

}

/* ---------- 四层判断框架（§3.2）---------- */

/* ---------- 六亲生态（转太极）---------- */
function anaEco(g, yong) {

/* ---------- 要览短词串：卦义，月态，月长生，日生克，日旺衰，日长生（，整态；v0.2.21 整态前缀加冒号）---------- */
function compactTokenArr(yi, wx, mzh, rzh, gwx, yin) {

/* ---------- 图形版：属性小字键值（值不带「月/日/整」前缀，键标注属性名）---------- */
var KV_KEYS = ["卦义", "月旺衰", "月长生", "日生克", "日旺衰", "日长生", "卦生克", "日资源", "月生克", "月通根", "日通根"];
function structTokenArr(yi, wx, mzh, rzh, gwx, yin) {

/* 两列面板行序（DOM 序＝grid 行优先）：整卦 5 行（v0.1.77）＝卦义｜日资源 / 月旺衰｜日旺衰 / 月长生｜日长生 / 月生克｜日生克 / 月通根｜日通根，
   其中日资源＝日支主气干在月支十二长生态（v0.2.24 口径修正：日干→日支主气，如午日取丁；与②表「上级资源」同口径，始卦终卦同值），通根＝卦宫五行对月支／日支藏干求根；
/* 半卦 5 行（v0.1.98 邦顺格式）＝月令组 月生克｜月长生 / 月旺衰｜月通根，日令组 日生克｜日长生 / 日旺衰｜日通根，行5 日资源｜空 */
var KV_LAYOUT = { gz: [0, 7, 1, 4, 2, 5, 8, 3, 9, 10], hf: [8, 2, 1, 9, 3, 5, 4, 10, 7, -1] };
function kvList(arr, mode, trends, yiName, ctx) {
  var order = mode ? KV_LAYOUT[mode] : arr.map(function (_, i) { return i; });
  var h = '<div class="kvs' + (mode ? ' ' + mode : '') + '">';
  order.forEach(function (ix) {
    if (ix < 0 || ix >= arr.length) { h += '<div class="kv kv-empty">&nbsp;</div>'; return; }
    var tv = (trends && trends[ix]) ? '<span class="tv ' + tvCls(trends[ix]) + '">' + trends[ix] + '</span>' : '';
    var vc = valCls(arr[ix]);
    var attrs = '';
    if (ix === 0 && yiName) attrs = ' class="kv-hit' + (vc ? ' ' + vc : '') + '" data-gua="' + esc(yiName) + '"';
    else if (ctx && arr[ix]) attrs = ' class="ah-link' + (vc ? ' ' + vc : '') + '" data-ah="kv" data-p="' + [ix, ctx.wx, ctx.mzh, ctx.rzh, ctx.yin ? 1 : 0, ctx.gwx || ""].join("|") + '"';
    else if (vc) attrs = ' class="' + vc + '"';
    h += '<div class="kv"><i>' + KV_KEYS[ix] + '</i><b' + attrs + '>' + esc(arr[ix]) + '</b>' + tv + '</div>';
  });
  return h + '</div>';
}
/* 旺衰配色（v0.1.46）：五态旺相绿／休黑／囚死红；十二长生至帝旺绿／衰至绝红／胎养黑 */
function valCls(v) {
  if (v === "旺" || v === "相" || v === "卦我比和" || v === "卦生我" || v === "我克卦") return "v-good";
  if (v === "囚" || v === "死" || v === "我生卦" || v === "卦克我") return "v-bad";
  var ci = CHANGSHENG.indexOf(v);
  if (ci > -1) return (ci <= 4) ? "v-good" : (ci <= 9) ? "v-bad" : "";
  return "";
}
function tvCls(t) { return (t === "↗") ? "tv-up" : (t === "↘") ? "tv-down" : "tv-flat"; }
/* 本变旺衰趋势线：五项值后标 ↗升／↘降／→平（长生链两段方向，v0.1.47） */
var WANG_SEQ = ["旺", "相", "休", "囚", "死"];
var GONG_SEQ = ["卦我比和", "卦生我", "我克卦", "我生卦", "卦克我"];
var CS_UP = ["胎", "养", "长生", "沐浴", "冠带", "临官", "帝旺"];
var CS_DOWN = ["衰", "病", "死", "墓", "绝"];
var TREND_IDX = [1, 2, 4, 5, 6];
function csTrend(b, i) {
  if (b === i) return "→";
  var ub = CS_UP.indexOf(b), ui = CS_UP.indexOf(i), db = CS_DOWN.indexOf(b), di = CS_DOWN.indexOf(i);
  if (ub > -1 && ui > -1) return (ui > ub) ? "↗" : "↘";
  if (db > -1 && di > -1) return (di > db) ? "↘" : "↗";
  return (ui > -1) ? "↗" : "↘";
}
function trendArrs(ben, bian) {
  if (!bian) return null;
  return TREND_IDX.reduce(function (m, i) {
    if (ben[i] == null || bian[i] == null) return m;
    if (i === 2 || i === 5) {
      var inU = function (v) { return CS_UP.indexOf(v) > -1 || CS_DOWN.indexOf(v) > -1; };
      if (!inU(ben[i]) || !inU(bian[i])) return m;
      m[i] = csTrend(ben[i], bian[i]);
      return m;
    }
    var seq = (i === 6) ? GONG_SEQ : WANG_SEQ;
    var a = seq.indexOf(ben[i]), b = seq.indexOf(bian[i]);
    if (a < 0 || b < 0) return m;
    m[i] = (a === b) ? "→" : (a < b) ? "↘" : "↗";
    return m;
  }, {});
}
/* ---------- 始终关系箭头：始＝左（本）终＝右（变），线中上方标生／克／比 ---------- */
function relArrow(zt) {
  if (!zt) return "";
  var dir = (zt === "始终比和") ? "both" : (zt.charAt(0) === "始") ? "fwd" : "back";
  var v = (zt === "始终比和") ? "比" : zt.charAt(1);
  return '<span class="rl-ar ' + dir + '"><i class="la">' + v + '</i><i class="ln"></i></span>';
}

/* ---------- 爻线图：bits 自下而上（true=阳），marks 对应位动爻 ---------- */
function guaFig(bits, marks) {
  var rows = [];
  for (var i = bits.length - 1; i >= 0; i--) {
    var on = marks && marks[i];
    rows.push('<span class="gf-row' + (on ? ' on' : '') + '"><i class="gf-y ' + (bits[i] ? 'yang' : 'yin') + '"></i><em class="gf-mk">' + (on ? (bits[i] ? '○' : '×') : '') + '</em></span>');
  }
  return '<span class="gf">' + rows.join("") + '</span>';
}

/* ---------- 整卦分析（图形版）：本卦六爻图卡 → 模式 → 变卦图卡，卡下属性小字 ---------- */
function anaGuaStruct(g) {
  var a = g.info, b = g.bian ? g.bian.info : null;
  var mode = b ? WX_MODE[wxRelation(a.gongWx, b.gongWx)] : null;
  var mzh = DZ[g.cal.mdz], rzh = g.cal.riZhi;
  function gzCell(info, bits, marks, toks, trends, yiName, ctx) {
    return '<div class="gz-cell">' + guaFig(bits, marks) +
      '<div class="gz-name">' + esc(info.name) + '</div>' +
      '<div class="gz-gong">' + esc(info.gong) + '宫</div>' +
      kvList(toks, 'gz', trends, yiName, ctx) + '</div>';
  }
  var benMarks = g.yao.map(function (y) { return y.moving; });
  var benToks = structTokenArr(GUA_YI[a.name] || "—", a.gongWx, mzh, rzh, null, tuYin(a.gong));
  var bianToks = b ? structTokenArr(GUA_YI[b.name] || "—", b.gongWx, mzh, rzh, null, tuYin(b.gong)) : null;
  var gzT = trendArrs(benToks, bianToks);
  var h = '<div class="gz-g">' + gzCell(a, g.yao.map(function (y) { return y.yang; }), benMarks, benToks, gzT, a.name, { wx: a.gongWx, mzh: mzh, rzh: rzh, yin: tuYin(a.gong), gwx: null });
  if (b) {
    h += '<div class="gz-mid">' + relArrow(mode.zt) + '<span class="mode-hit" data-mode="' + esc(mode.name) + '"><b class="hl">' + esc(mode.name) + '</b></span></div>';
    h += gzCell(b, g.bian.yao.map(function (y) { return y.yang; }), benMarks, bianToks, gzT, b.name, { wx: b.gongWx, mzh: mzh, rzh: rzh, yin: tuYin(b.gong), gwx: a.gongWx });
  } else {
    h += '<div class="gz-mid"><span class="dim">六爻全静，无变卦 —— 无本↔变的模式关系。</span></div>';
  }
  h += '</div>';
  return { title: "整卦分析 · " + a.name + (b ? " → " + b.name : "（本卦）"), html: h };
}

/* ---------- 半卦分析：本 / 变 各分上、下卦（表格）---------- */
function halfUpDownText(up, low, shiUp) {
  var wu = GONG_WX[up.n], wl = GONG_WX[low.n];
  var rel = wxRelation(wu, wl);
  if (rel === "比和") return { up: "上下比和", shi: "世应比和", wo: "我事比和" };
  var upToDown = (rel === "生" || rel === "克");
  var v = (rel === "生" || rel === "被生") ? "生" : "克";
  var meFirst = (shiUp === upToDown);
  return { up: (upToDown ? "上" + v + "下" : "下" + v + "上"),
    shi: (meFirst ? "世" + v + "应" : "应" + v + "世"),
    wo: (meFirst ? "我" + v + "事" : "事" + v + "我") };
}
/* ---------- 双方强弱（v0.1.99）：我方/他方半卦五行受事局（始卦宫）五行生克 → 卦生克五态意义语＋强弱档 ---------- */
var SF_STRONG = { "卦我比和": "最强", "卦生我": "三强", "我克卦": "次强", "我生卦": "次弱", "卦克我": "最弱" };
var SF_REL = {
  "克": ["我方克对方", "我方有主决策权"],
  "被克": ["对方克我方", "他方有主决策权"],
  "被生": ["对方生我方", "他方支持我方决策"],
  "生": ["我方生对方", "我方支持他方决策"],
  "比和": ["双方比和", "双方同频共同协商"]
};
function sfStrongText(lv, isWo) {
  var m = {
    "卦生我": isWo ? "事局支持我" : "事局支持他方",
    "我生卦": isWo ? "我方支持事局" : "他方支持事局",
    "卦克我": isWo ? "事局约束我" : "事局约束他方",
    "我克卦": isWo ? "我方管控事局" : "他方管控事局",
    "卦我比和": isWo ? "我方代表事局" : "他方代表事局"
  };
  return m[lv] + "（" + SF_STRONG[lv] + "）";
}
/* ---------- 半卦分析（图形版）：上/下卦各一卡（本变三爻图＋标位＋模式＋始终词＋双列属性小字），末尾三关系行；数据取 g.half（引擎 halfLevel） ---------- */
function anaHalfStruct(g) {
  var a = g.info, b = g.bian ? g.bian.info : null;
  var H = g.half, shiUp = H.shiUp;
  var ru = shiUp ? "世" : "应", rl = shiUp ? "应" : "世";
  var mzh = DZ[g.cal.mdz], rzh = g.cal.riZhi;
  function triBits(n) { return TRI_BY_NAME[n].b.split("").map(function (c) { return c === "1"; }); }
  function hfCard(tag, p) {
    var bt = structTokenArr(TRI_YI[p.ben.n] || "—", p.ben.wx, mzh, rzh, a.gongWx, tuYin(p.ben.n));
    var wt = p.bian ? structTokenArr(TRI_YI[p.bian.n] || "—", p.bian.wx, mzh, rzh, b.gongWx, tuYin(p.bian.n)) : null;
    var T = trendArrs(bt, wt);
    var h = '<div class="hf-card"><div class="hf-head">';
    h += '<span class="hf-side">' + guaFig(triBits(p.ben.n), null) + '<span class="hf-name">' + esc(p.ben.n) +
      (tag ? '<b class="st-pos">' + esc(tag) + '</b>' : '') + '</span></span>';
    h += '<span class="hf-mid">' + (p.md ? '<span class="mode-hit" data-mode="' + esc(p.md.name) + '"><b class="hl">' + esc(p.md.name) + '</b></span>' + relArrow(p.md.zt)
      : '<span class="dim">—（无变卦）</span>') + '</span>';
    if (p.bian) h += '<span class="hf-side">' + guaFig(triBits(p.bian.n), null) + '<span class="hf-name">' + esc(p.bian.n) + '</span></span>';
    h += '</div><div class="hf-body' + (p.bian ? '' : ' single') + '">' +
      kvList(bt, 'hf', T, p.ben.n, { wx: p.ben.wx, mzh: mzh, rzh: rzh, yin: tuYin(p.ben.n), gwx: a.gongWx }) +
      (p.bian ? kvList(wt, 'hf', T, p.bian.n, { wx: p.bian.wx, mzh: mzh, rzh: rzh, yin: tuYin(p.bian.n), gwx: b.gongWx }) : '') + '</div></div>';
    return h;
  }
  var h = '<div class="hf-wrap">' + hfCard(ru, H.up) + hfCard(rl, H.low);
  var r1 = halfUpDownText({ n: H.up.ben.n }, { n: H.low.ben.n }, shiUp),
      r2 = b ? halfUpDownText({ n: H.up.bian.n }, { n: H.low.bian.n }, shiUp) : null;
  function relRow(label, ben, bian) {
    return '<div class="hf-rel"><span class="rc rc-l"><i>' + label + '</i><b>' + ben + '</b></span>' +
      '<span class="rc-mid"></span>' +
      '<span class="rc rc-r">' + (bian ? '<b>' + bian + '</b>' : '<span class="dim">—</span>') + '</span></div>';
  }
  h += '<div class="hf-rels">';
  h += relRow("上下卦", r1.up, r2 && r2.up);
  h += relRow("世应", r1.shi, r2 && r2.shi);
  h += relRow("我事", r1.wo, r2 && r2.wo);
  h += '</div>';
  h += '</div>';
  return { title: "双方态势分析", html: h };
}

/* ---------- 半卦层双方态势分析（第 23 轮：我方/对方 × 三大块，九读算法与整卦同源，端＝半卦五行） ---------- */
function anaShuangfang(g) {
  var H = g.half, mzh = DZ[g.cal.mdz], rzh = g.cal.riZhi;
  var wo = H.shiUp ? H.up : H.low, ta = H.shiUp ? H.low : H.up;
  var staticGua = !g.bian || g.bian.info.name === g.info.name; // 同卦时引擎仍建变卦镜像，但按体系口径＝静局未动
  function reads(p) {
    var ben = p.ben, bian = p.bian || p.ben;
    return {
      q0: cbQl(ben.wx, mzh), q1: cbQl(bian.wx, mzh),
      f0: cbGan12Full(ben.n, mzh), f1: cbGan12Full(bian.n, mzh),
      f0r: cbGan12Full(ben.n, rzh), f1r: cbGan12Full(bian.n, rzh),
      t0: cbTidui(ben.wx, mzh), t1: cbTidui(bian.wx, mzh),
      s0: cbTidui(ben.wx, rzh), s1: cbTidui(bian.wx, rzh),
      ms0: monthState(ben.wx, mzh, null), ms1: monthState(bian.wx, mzh, null),
      mi0: monthState(ben.wx, rzh, null), mi1: monthState(bian.wx, rzh, null),
      r0: cbRelKey(ben.wx, rzh), r1: cbRelKey(bian.wx, rzh),
      zyF: gan12Full(ZHI_CANG[rzh][0], mzh)
    };
  }
  var Rw = reads(wo), Rt = reads(ta);
  function sideHead(p, R) {
    if (staticGua) return { head: "静局未动 · 不另判启动", pro: "静局无过程 · —" };
    var hasRoot = (R.t0 >= 1 || R.s0 >= 1), qiIn = R.q0.de || (R.mi0.level === "旺" || R.mi0.level === "相");
    var qd = hasRoot && qiIn ? "顺畅启动" : hasRoot ? "勉力启动" : qiIn ? "借力启动" : "艰难启动";
    var qdDe = hasRoot && qiIn ? "顺易" : (hasRoot || qiIn) ? "偏难" : "极难";
    var head = "非静局 · " + qd + "（" + qdDe + "）";
    var rel = wxRelation(p.ben.wx, p.bian.wx), pro;
    if (rel === "比和") { pro = "同气置换 · 同气落成（难易不适用）"; }
    else {
      var isKe = rel === "克" || rel === "被克";
      var shou = (rel === "生" || rel === "克") ? "始" : "终";
      var cdShi = shou === "始" ? R.s0 : R.s1, cdShou = shou === "始" ? R.s1 : R.s0;
      var df = cdShi - cdShou;
      var cw = (isKe ? CB_KE7 : CB_SH7)[df + 3];
      pro = p.md.name + " · " + cw[0] + "（" + cw[1] + "）";
    }
    return { head: head, pro: pro };
  }
  var Hw = sideHead(wo, Rw), Ht = sideHead(ta, Rt);
  function sfRow(i, label, woTxt, taTxt) {
    return '<div class="cb-row"><i>' + i + ' ' + label + '</i><div class="sf-stack"><b><span class="sf-tag sf-wo">我方</span>' + woTxt + '</b><span><span class="sf-tag sf-ta">对方</span>' + taTxt + '</span></div></div>';
  }
  function miniRel(label, s0, s1) {
    return '<tr><td>' + label + '</td><td>' + s0 + '</td><td>' + s1 + '</td></tr>';
  }
  function mini4(label, w0, w1, t0, t1) {
    return '<tr><td>' + label + '</td><td><div class="sf-line"><span class="sf-tag sf-wo">我</span>' + w0 + '</div><div class="sf-line"><span class="sf-tag sf-ta">他</span>' + t0 + '</div></td><td><div class="sf-line"><span class="sf-tag sf-wo">我</span>' + w1 + '</div><div class="sf-line"><span class="sf-tag sf-ta">他</span>' + t1 + '</div></td></tr>';
  }
  var h = '<div class="cb-panel">';
  h += sfRow("1", "前置启动", Hw.head, Ht.head);
  h += sfRow("2", "过程难易", Hw.pro, Ht.pro);
  var A = g.info, B = g.bian ? g.bian.info : null;
  function sfEnd(p, isWo) {
    if (!B || !p.bian) return '<span class="dim">—（静局无变）</span>';
    return sfStrongText(gongState(p.bian.wx, B.gongWx).level, isWo);
  }
  h += '<table class="cb-mini sf-mini"><thead><tr><th>双方</th><th>起点</th><th>终点</th></tr></thead><tbody>';
  h += mini4("双方强弱", sfStrongText(gongState(wo.ben.wx, A.gongWx).level, true), sfEnd(wo, true), sfStrongText(gongState(ta.ben.wx, A.gongWx).level, false), sfEnd(ta, false));
  var sfr0 = SF_REL[wxRelation(wo.ben.wx, ta.ben.wx)];
  var sfrE = (B && wo.bian && ta.bian) ? SF_REL[wxRelation(wo.bian.wx, ta.bian.wx)] : null;
  h += miniRel("双方关系", sfr0[0] + " · " + sfr0[1], sfrE ? sfrE[0] + " · " + sfrE[1] : '<span class="dim">—（静局无变）</span>');
  h += '</tbody></table>';
  h += '<details class="cb-fold"><summary>资源关系 <span class="dim">（点击展开）</span></summary><table class="cb-mini sf-mini"><thead><tr><th>资源关系</th><th>起点</th><th>终点</th></tr></thead><tbody>';
  h += mini4(cbLink("趋势关系"), CB_MS_JIE[CB_MS_NAME[Rw.ms0.rel]], CB_MS_JIE[CB_MS_NAME[Rw.ms1.rel]], CB_MS_JIE[CB_MS_NAME[Rt.ms0.rel]], CB_MS_JIE[CB_MS_NAME[Rt.ms1.rel]]);
  h += mini4(cbLink("发展空间"), CB_SPACE[Rw.q0.level], CB_SPACE[Rw.q1.level], CB_SPACE[Rt.q0.level], CB_SPACE[Rt.q1.level]);
  h += mini4(cbLink("资源丰沛"), cbRsMean(Rw.f0.rank), cbRsMean(Rw.f1.rank), cbRsMean(Rt.f0.rank), cbRsMean(Rt.f1.rank));
  h += mini4(cbLink("趋势梯队"), CB_TI_NAME[Rw.t0], CB_TI_NAME[Rw.t1], CB_TI_NAME[Rt.t0], CB_TI_NAME[Rt.t1]);
  h += '</tbody></table></details>';
  h += '<details class="cb-fold"><summary>权力关系 <span class="dim">（点击展开）</span></summary><table class="cb-mini sf-mini"><thead><tr><th>权力关系</th><th>起点</th><th>终点</th></tr></thead><tbody>';
  h += mini4(cbLink("上级关系"), CB_POWER_JIE[CB_POWER_NAME[Rw.r0]], CB_POWER_JIE[CB_POWER_NAME[Rw.r1]], CB_POWER_JIE[CB_POWER_NAME[Rt.r0]], CB_POWER_JIE[CB_POWER_NAME[Rt.r1]]);
  h += mini4(cbLink("向外借力"), CB_JIE2[Rw.mi0.level], CB_JIE2[Rw.mi1.level], CB_JIE2[Rt.mi0.level], CB_JIE2[Rt.mi1.level]);
  h += mini4(cbLink("发展评级"), cbGradeMean(Rw.f0r.rank), cbGradeMean(Rw.f1r.rank), cbGradeMean(Rt.f0r.rank), cbGradeMean(Rt.f1r.rank));
  h += mini4(cbLink("支持梯队"), CB_TI_NAME[Rw.s0], CB_TI_NAME[Rw.s1], CB_TI_NAME[Rt.s0], CB_TI_NAME[Rt.s1]);
  h += mini4(cbLink("上级资源"), cbRsMean(Rw.zyF.rank), cbRsMean(Rw.zyF.rank), cbRsMean(Rt.zyF.rank), cbRsMean(Rt.zyF.rank));
  h += '</tbody></table></details>';
  h += '</div>';
  return { title: "双方态势 · 我方与对方", html: h };
}

/* ---------- 整卦层整体态势分析（参考资料 29 · v1.31 九读＝月令四读＋日令五读）----------
   月令四读：发展空间（月旺衰，monthState 档序＋空间语）、资源丰沛（月长生，cbGan12@月支「n/6 位名」）、

   评级档（十二长生）只作制度定级，不进裁定比较；②成败裁定（参考资料 31 · 前置与成败难易）：施受方向由五行关系定
   （始生终·始克终施动＝始，终生始·终克始施动＝终，比和无），三机制生转化读梯队差（难度来源施动端供给缺口）／
   克约束读梯队差（难度来源受动端对抗阻力）／比和置换难易不适用；梯队差＝施动端支持梯队－受动端支持梯队，
   七档克式生式双语系（＋3压迫／宽供·＋2压力／足供·＋1顺畅／稳供·0持平／平供·－1勉力／紧供·－2艰难／乏供·－3遇抗落成／微供顺推，全部属成）；
   末位五子型降格结构说明（起点无力·倒逼无力·反哺无源·虚成无托·遇抗被损）只作判词注解不判成败；
   判词全集成十五不成零非成非败一（废止虚动不成·受阻难成·反抗难成·不能启动）；启动判定改环节只出难易四档

  "成败裁定": { what: "成败与难易的裁定（参考资料 31）。成败只有两种输出：静局未动则成败不成立；凡有转移结构则判成——本体系不输出不成档，环节因难不等于事情不成。成败只是概率，不是绝对，此限定适用于成败、好坏、难易三维全部判词。落成只表示模式执行成立，不表示结果优于初始；成败是过程判断，只裁模式落地：不借终态成色（好坏）、不借难易、不借意愿——三者互不改写。推进难易只由两端的「支持梯队（日令通根）」之差裁定——月令与两端的关系只说明发展空间、资源丰沛、趋势梯队与趋势关系，不参与裁定；向外借力、发展评级、权力关系和上级资源也不参加。启动难易与推进难易双轨并列：启动问的是起步费不费力，推进问的是主体过程费不费力，各自输出，不取较难者、不折算总档、互不改写。",

  "前置启动": { what: "四项判断之前先过两道闸门：静局判定与启动判定。两道闸门只回答「这件事有没有动、动不动起来」，不改写四项判断中任何读数的取法与档位；启动判定只出难易档不判成败——凡有转移结构即判成，流程不截断（v0.1.91）。",

  "过程难易": { what: "过程难易回答「从起点到结果这段路走成什么样、走起来费不费力」，路由两卦五行关系一次定五型机制：始生终＝主动顺推（结果导向）·始克终＝全程管控（初始导向）·终生始＝反哺受限（初始导向）·终克始＝结果倒逼（结果导向）·比和＝同气维持（无导向）。导向读的是过程中谁照顾谁：初始导向＝结果要回头照顾原有基础、承诺和利益；结果导向＝为了形成结果，起点主动投入或打破原有基础和限制。难易档由成败裁定的支持梯队七档给出，本节只显示不重算。",

      bt.push(POS_CN[bp] + " " + b.liuqin + b.gan + b.zhi + ((b.moved || b.wx !== by.wx) ? (b.moved ? "(动)" : "(静变·" + (by.bianRel || "") + ")") + "［" + plain(yaoWxTags(b.wx, b.zhi, cal, g.bian.info.gongWx, (bp < 3 ? GONG_WX[g.bian.info.lower.n] : GONG_WX[g.bian.info.upper.n]))) + "］" : ""));
    }

}

function computeAndShow() {
  var y = parseInt($("in-y").value, 10), m = parseInt($("in-m").value, 10), d = parseInt($("in-d").value, 10);
  var hh = parseInt($("in-h").value, 10), mi = parseInt($("in-mi").value, 10);
  if (!(y > 999 && m >= 1 && m <= 12 && d >= 1 && d <= 31 && hh >= 0 && hh <= 23 && mi >= 0 && mi <= 59)) {
    $("err").textContent = "摇卦时间填写不完整（年 1000–2100，月 1–12，日 1–31，时 0–23，分 0–59）。";
    return;
  }
  $("err").textContent = "";
  var cal = computePillars(y, m, d, hh, mi);
  var states = S.states.slice();
  for (var ci = 0; ci < 6; ci++) {
    if (states[ci] === null || states[ci] === undefined) {
      $("err").textContent = "六爻尚未录入完整（" + POS_CN[ci] + "爻未选）。";
      return;
    }
  }
  var dong = dongPosList(states);
  var dualOn = S.dual && S.dual.phase === "done" && S.dual.endCode !== null;
  if (dualOn) {
    S.tossNote = "";
  } else {
    S.tossNote = dong.length
      ? "六爻状态录入 → 动爻 " + dong.length + " 个（" + dong.join("、") + "爻）"
      : "六爻状态录入 → 六爻皆静，无变爻";
  }
  var bits = states.map(function (s) { return (s === 7 || s === 9) ? '1' : '0'; }).join('');
  var g = zhuangGua(bits, states, cal, dualOn && !dong.length);
  var ref = refZhiOf(S.refKey, cal);
  computeState(g, { refZhi: ref.zhi, refLabel: ref.label, muRef: [{ zhi: DZ[cal.mdz], label: "月" }, { zhi: cal.riZhi, label: "日" }] });
  S.g = g;
  S.question = $("in-q").value;
  var nk = states.join(",");
  if (S.noteKey !== nk) { S.note = ""; S.noteKey = nk; }
  runAnalysis();
}

var ARC_KEY = "ly_paipan_archives_v1";

function arcLoad() {

}
function fmtClock(n) { return (n < 10 ? "0" : "") + n; }

}

var GUA_LIST = [];
function buildGuaList() {

    items.push({ code: c, name: gi.name, gong: gi.gong, seq: gi.seq });
  }
  var order = TRI.map(function (t) { return t.n; });
  items.sort(function (a, b) {
    var ga = order.indexOf(a.gong), gb = order.indexOf(b.gong);

  });

}
